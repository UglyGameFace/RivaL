name: RivaL archive model weekly training

# Trains the archive_v1 offline logistic (spec §2.3-§2.7, D1/D4) and the
# gbm_v1 offline GBM (autonomous loop Phase 2, spec §3.4, D4/D6) on the
# verified Drive archive and publishes artifacts that pass their offline
# gates to the private Drive models folder. A run that fails its gates
# publishes a kind="report" only -- no model artifact. The bot imports a
# published artifact only through the existing manifest cross-check, and
# it serves only through the existing Route B promotion gates (Phase 2).
# regime_v2 was retired in PR #464 and is no longer trained by this job.
# The GBM trains as a step in this same workflow (no separate workflow
# file): same restored bytes, same --train-end / --test-start /
# --trained-through, same manifests dir, per-horizon + per-step failure
# isolation. Never on ordinary pushes: weekly retrain + a tightly date-locked
# one-off 2026-11-13 post-export/frame-repair recovery + manual dispatch only.
on:
  schedule:
    - cron: "30 7 * * 0"
    # Nov 13's cron did not appear in GitHub Actions after its scheduled time.
    # The fallback uses a one-time workflow-file push on the actual date.
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-model-training.yml"
      - "src/parlay_bot/research/xmarket_training.py"
      - "src/parlay_bot/research/recorded_candles.py"
      - "src/parlay_bot/research/source_native.py"
      - "tools/verify_recorded_partial_restore.py"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish passing models (and failing reports) to Drive"
        type: boolean
        default: true
      asset:
        description: "Asset to train (empty = all four)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rival-archive-model-training
  cancel-in-progress: false

jobs:
  # The one-time source-ready fallback runs ONLY from main on 2026-11-13
  # when this workflow or the broken trainer is repaired. No future push can
  # train with this retired trigger. Manual dispatch and Sunday schedule remain unchanged.
  schedule_guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check scheduled date gates
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
        run: |
          today="$(date -u +%F)"
          if [[ "$EVENT_NAME" == "push" && "$today" != "2026-11-13" ]]; then
            echo "One-time XMarket post-export fallback expired; skip without training."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "schedule" && "$EVENT_CRON" == "30 7 * * 0" && "$today" == "2026-11-15" ]]; then
            echo "Skipping the 2026-11-15 scheduled archive training."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  train:
    needs: schedule_guard
    if: needs.schedule_guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      matrix:
        asset: [BTC, ETH, SOL, XRP]
      fail-fast: false
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: binance-cache
          key: archive-v1-binance-cache-${{ matrix.asset }}-${{ github.run_id }}
          restore-keys: archive-v1-binance-cache-${{ matrix.asset }}-
      - name: Install
        run: python -m pip install -e ".[ml-research]" "pandas>=2.2" "numpy>=1.26"
      # Step 1 (spec §2.3): measure what exists before training. The census
      # is names-only; every month still has to pass restore verification.
      - name: Drive census (measure first)
        run: python -m parlay_bot.research.drive_source_census
      # Step 2: restore verified complete months plus missing/partial candle
      # partitions from SHA-verified original daily ledger backups. Gaps and
      # absent source days remain explicit; partials never count as full months.
      - name: Restore verified months
        run: |
          python tools/restore_archive_months.py --asset ${{ matrix.asset }} \
            --root data/archive-v1-restore
          mkdir -p archive-v1-models
          cp data/archive-v1-restore/restore-report.json archive-v1-models/restore-report.json
      # Publish metadata immediately so source availability can be checked
      # without waiting for all model families/horizons to finish training.
      - name: Upload restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-v1-restore-${{ matrix.asset }}-${{ github.run_id }}
          path: data/archive-v1-restore/restore-report.json
          if-no-files-found: error
      # Step 3: train once per (asset, horizon). The shared weekly run
      # (train_weekly_archive) trains archive-v1, gbm-v1 and volcal-v1
      # for every (asset, horizon) on the same restored bytes, same
      # splits, same provenance. Binance 5m loads from official
      # Vision ZIPs via the pooled-training loader (SHA verified against
      # the provider .CHECKSUM at fetch). Splits are fixed per run: the
      # last 28 days are the test slice, the 28 days before that are
      # validation; both purged by one horizon.
      - name: Train (all horizons)
        run: |
          last_month="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"
          through_day="$(date -u -d yesterday +%Y-%m-%d)"
          test_start="$(date -u -d "-28 days" +%Y-%m-%dT00:00:00+00:00)"
          train_end="$(date -u -d "-56 days" +%Y-%m-%dT00:00:00+00:00)"
          trained_through="$(date -u -d yesterday +%Y-%m-%dT23:55:00+00:00)"
          publish_flag=""
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "push" || "${{ inputs.publish }}" == "true" ]]; then
            publish_flag="--publish"
          fi
          failed=0
          for horizon in 5 15 60; do
            python tools/train_archive_model.py \
              --asset ${{ matrix.asset }} --horizon "$horizon" \
              --manifests-dir data/archive-v1-restore \
              --census data/native-reports/drive-source-census.json \
              --binance-cache binance-cache \
              --binance-last-month "$last_month" \
              --binance-through-day "$through_day" \
              --train-end "$train_end" --test-start "$test_start" \
              --trained-through "$trained_through" \
              --out archive-v1-models $publish_flag || failed=1
          done
          exit "$failed"
      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-v1-${{ matrix.asset }}-${{ github.run_id }}
          path: archive-v1-models/
          if-no-files-found: error
      - name: Summarize actual model outcomes
        if: always()
        run: python -m parlay_bot.research.training_outcomes archive-v1-models --asset ${{ matrix.asset }}

  recorded_original_readback:
    # A post-merge source-code change must prove that private original bytes
    # can be restored, even when the one-off training push window has expired.
    # This is read-only; no training or model publication, no raw artifact upload.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        asset: [BTC, ETH, SOL, XRP]
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verified archive reader
        run: python -m pip install -e ".[archive]"
      - name: Prove November-original compatible readback, not training
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          python tools/verify_recorded_partial_restore.py \
            --asset "$ASSET" --lookback-days 28 \
            --root "data/recorded-private-originals/$ASSET" \
            --out "data/native-reports/recorded-partial-proof-$ASSET.json"
      - name: Upload concise restoration verdict only (never private originals)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recorded-partial-proof-${{ matrix.asset }}-${{ github.run_id }}
          path: data/native-reports/recorded-partial-proof-${{ matrix.asset }}.json
          if-no-files-found: error
          retention-days: 7
