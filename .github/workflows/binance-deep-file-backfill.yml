name: Binance official 2021+ monthly ZIP archive backfill

on:
  pull_request:
    paths:
      - ".github/workflows/binance-deep-file-backfill.yml"
      - "src/parlay_bot/research/binance_deep_backfill.py"
      - "src/parlay_bot/archive/drive.py"
      - "src/parlay_bot/research/free_history.py"
      - "src/parlay_bot/research/publish.py"
      - "tests/test_binance_deep_backfill.py"
      - "src/parlay_bot/research/source_family_coverage.py"
      - "tests/test_source_family_coverage.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/binance-deep-file-backfill.yml"
      - "src/parlay_bot/research/binance_deep_backfill.py"
      - "src/parlay_bot/archive/drive.py"
  workflow_dispatch:
    inputs:
      chain:
        description: "Continuation number (set automatically; leave 0)"
        required: false
        default: "0"
  # Runs continue themselves while backlog remains; the schedule only
  # restarts a chain GitHub dropped.
  schedule:
    - cron: "43 1,7,13,19 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: rival-binance-2021-monthly-archive
  cancel-in-progress: false

jobs:
  binance-archive-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test exact source identity and verified publication path
        run: |
          python -m pip install -e ".[dev]"
          ruff check src/parlay_bot/research/binance_deep_backfill.py tests/test_binance_deep_backfill.py
          pytest -q tests/test_binance_deep_backfill.py

  binance-history:
    if: github.event_name != 'pull_request' && vars.RIVAL_NATIVE_PUBLIC_BOOTSTRAP_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official archive verification and private Drive uploader
        run: python -m pip install -e ".[archive]"
      - name: Require existing private RivaL warehouse authorization
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID \
            RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID \
            RIVAL_DRIVE_MODELS_FOLDER_ID RIVAL_DRIVE_REPORTS_FOLDER_ID \
            RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET \
            RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Binance archival warehouse not configured: $name"
              exit 1
            fi
          done
      - name: Publish provider-checksum monthly 5m sources for a 45-minute budget
        shell: bash
        run: |
          set -euo pipefail
          python -m parlay_bot.research.binance_deep_backfill \
            --max-new 5000 --time-budget-seconds 2700 \
            | tee "$RUNNER_TEMP/collector-summary.json"
      - name: Continue while backlog remains (self-dispatch, bounded chain)
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain || '0' }}
        run: |
          set -euo pipefail
          summary="$(tail -n 1 "$RUNNER_TEMP/collector-summary.json")"
          read -r backlog progress reason < <(python -c '
          import json, sys
          s = json.loads(sys.argv[1])
          print(s.get("backlog_remaining", 0), s.get("new_months", 0), s.get("stopped_reason", "unknown"))
          ' "$summary")
          echo "backlog=$backlog progress=$progress reason=$reason chain=$CHAIN"
          # Chain only while the last run made progress and stopped on its own
          # time budget; a throttle, storage guard or empty backlog ends it.
          if [[ "$backlog" -gt 0 && "$progress" -gt 0 && "$CHAIN" -lt 40 \
                && ( "$reason" == "time_budget_reached" || "$reason" == "max_new_reached" ) ]]; then
            gh workflow run "binance-deep-file-backfill.yml" --repo "$GITHUB_REPOSITORY" --ref main -f chain="$((CHAIN + 1))"
            echo "::notice::Queued continuation $((CHAIN + 1)) with $backlog item(s) left"
          fi
      - name: Inventory all 2021+ source-family evidence without claiming missing data is complete
        if: always()
        shell: bash
        run: |
          mkdir -p data/binance-deep data/native-reports
          python -m parlay_bot.research.source_family_coverage \
            --root data/binance-deep --out-dir data/native-reports
      - name: Preserve source evidence, incomplete month and provider-unavailable details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-2021-official-archive-receipts
          path: |
            data/native-reports/binance-2021-bulk-progress.json
            data/native-reports/source-family-summary.json
            data/native-reports/source-family-coverage.jsonl.gz
          retention-days: 14
          if-no-files-found: ignore
