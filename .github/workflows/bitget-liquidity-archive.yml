name: Bitget verified public liquidity + funding to private Drive

on:
  pull_request:
    paths:
      - ".github/workflows/bitget-liquidity-archive.yml"
      - "src/parlay_bot/research/bitget_liquidity_archive.py"
      - "tests/test_bitget_liquidity_archive.py"
  push:
    branches: [main]
    paths:
      # Immediate first verified capture after merge, not every unrelated PR.
      - ".github/workflows/bitget-liquidity-archive.yml"
      - "src/parlay_bot/research/bitget_liquidity_archive.py"
  schedule:
    # Bounded GitHub public-source samples, not a complete 5m trade tape.
    - cron: "2,17,32,47 * * * *"
    - cron: "23 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Capture source snapshots or historical funding pages"
        required: true
        type: choice
        options: [live, funding]

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original source contracts offline
        run: |
          python -m pip install -e ".[dev,archive]"
          ruff check src/parlay_bot/research/bitget_liquidity_archive.py tests/test_bitget_liquidity_archive.py
          pytest -q tests/test_bitget_liquidity_archive.py

  archive:
    if: github.event_name != 'pull_request' && vars.RIVAL_BITGET_LIQUIDITY_ENABLED != 'false'
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'push' && '["live","funding"]' || github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.mode) || github.event.schedule == '23 0 * * *' && '["funding"]' || '["live"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: rival-bitget-liquidity-${{ matrix.mode }}
      cancel-in-progress: false
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated archive dependencies
        run: python -m pip install -e ".[archive]"
      - name: Verify required private Drive configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID \
            RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID \
            RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET \
            RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required private Drive setting: $name"
              exit 1
            fi
          done
      - name: Archive original Bitget responses and independently read back SHA-256
        run: |
          python -m parlay_bot.research.bitget_liquidity_archive \
            --mode "${{ matrix.mode }}"
      - name: Summarize verified source coverage without model promotion
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path("data/native-reports/bitget-liquidity-${{ matrix.mode }}-progress.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              if not p.exists():
                  f.write("No archive readback receipt. Review API/Drive errors.\n")
              else:
                  r = json.loads(p.read_text())
                  f.write("### Bitget genuine source capture\n\n")
                  for key in ("status", "mode", "responses", "issues",
                              "raw_sha256", "manifest_sha256",
                              "drive_sha256_readback_verified"):
                      f.write(f"- {key}: {str(r.get(key))[:800]}\n")
                  f.write("\nResearch archive only; no model training or trading authorized.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitget-liquidity-${{ matrix.mode }}-readback-receipt
          path: data/native-reports/bitget-liquidity-${{ matrix.mode }}-progress.json
          if-no-files-found: ignore
          retention-days: 14
