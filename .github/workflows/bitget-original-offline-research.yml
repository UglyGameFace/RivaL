name: Bitget verified original-history offline research

on:
  push:
    branches: [main]
    paths:
      # One-time catch-up when this job itself changes. No retraining on
      # unrelated main commits, and no interference with Bitget acquisition.
      - ".github/workflows/bitget-original-offline-research.yml"
  schedule:
    # Research one Bitget asset per day without disturbing live collectors.
    - cron: "29 12 * * *"
  workflow_dispatch:
    inputs:
      asset:
        description: Source-native Bitget perpetual asset to train offline
        required: true
        type: choice
        options: [BTC, ETH, SOL, XRP]

permissions:
  contents: read

jobs:
  research:
    if: vars.RIVAL_NATIVE_RESEARCH_ENABLED != 'false' && vars.RIVAL_BITGET_OFFLINE_RESEARCH_ENABLED != 'false'
    # The initial source-byte restore proved XRP. On this workflow's first
    # push, research the three untrained assets in parallel. Other events
    # remain one bounded asset, retaining the existing daily free runner pace.
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(github.event_name == 'push' && '["BTC","ETH","SOL"]' || github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.asset) || '["daily"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    concurrency:
      group: rival-bitget-verified-offline-training-${{ matrix.asset }}
      cancel-in-progress: false
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated offline-model dependencies
        run: python -m pip install -e ".[dev,ml-research]"
      - name: Verify private Drive and research one asset without live promotion
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID \
            RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID \
            RIVAL_DRIVE_MODELS_FOLDER_ID RIVAL_DRIVE_REPORTS_FOLDER_ID \
            RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET \
            RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing private Drive config: $name"
              exit 1
            fi
          done
          if [[ "${{ matrix.asset }}" == "daily" ]]; then
            ASSETS=(BTC ETH SOL XRP)
            SLOT=$(( $(date -u +%s) / 86400 % 4 ))
            ASSET="${ASSETS[$SLOT]}"
          else
            ASSET="${{ matrix.asset }}"
          fi
          echo "Research-only Bitget source: $ASSET"
          python -m parlay_bot.research.source_native_offline \
            --venue bitget --asset "$ASSET" --months 6 --publish
      - name: Report actual research candidate and source-month evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path("data/native-reports/source-bitget-research.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as sink:
              if not report.exists():
                  sink.write("No completed Bitget research report. Check job output.\n")
              else:
                  result = json.loads(report.read_text())
                  sink.write("### Bitget original-source offline research\n\n")
                  for key in ("asset", "status", "restored_manifests",
                              "compatible_candidate_count", "compatible_screened",
                              "published_models", "promoted_live"):
                      sink.write(f"- {key}: {result.get(key)}\n")
                  sink.write("\nThis is NOT prospective forward-skill proof or live promotion.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitget-original-offline-research-evidence
          path: data/native-reports/source-bitget-research.json
          if-no-files-found: ignore
          retention-days: 14
