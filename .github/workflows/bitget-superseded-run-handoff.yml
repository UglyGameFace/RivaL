name: Bitget one-time superseded-run handoff

# Operational handoff only. No Drive deletion and no archive mutation.
# Triggers once on addition of this file to main; pinned old/new run IDs
# prevent the cancellation from affecting later jobs.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bitget-superseded-run-handoff.yml"

permissions:
  contents: read
  actions: write

jobs:
  release-obsolete-bitget-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Cancel only verified superseded Bitget run and observe corrected handoff
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const oldId = 41387989374;
            const newId = 41398873781;
            const oldSha = 'ca9f4292c3a4d6a0f48de9dae4ae3ff7ed4e0182';
            const correctedSha = '490301237c618dc5b7404b55d9495be813fc433a';
            const get = async id => (await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: id
            })).data;
            const old = await get(oldId);
            const next = await get(newId);
            core.info(JSON.stringify({
              event: 'bitget_handoff_preflight',
              old_run: { id: old.id, sha: old.head_sha, status: old.status },
              corrected_run: { id: next.id, sha: next.head_sha, status: next.status }
            }));
            if (old.head_sha !== oldSha || next.head_sha !== correctedSha ||
                old.head_branch !== 'main' || next.head_branch !== 'main') {
              throw new Error('Pinned Bitget run identities did not match; no cancellation');
            }
            if (old.path !== '.github/workflows/bitget-v3-overnight-archive.yml' ||
                next.path !== old.path) {
              throw new Error('Bitget workflow identity changed; no cancellation');
            }
            if (old.status === 'completed') {
              core.notice('Old run already completed; locks released without action');
              return;
            }
            if (old.status !== 'in_progress' ||
                !['pending', 'queued', 'in_progress'].includes(next.status)) {
              throw new Error('Unexpected run state; did not cancel anything');
            }
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: oldId, per_page: 100 }
            );
            const active = jobs.filter(j => j.name.startsWith('bitget-overnight-to-drive (') &&
              j.status === 'in_progress');
            const expected = ['BTC', 'ETH', 'SOL', 'XRP'];
            if (active.length !== 4 ||
                !expected.every(a => active.some(j => j.name === `bitget-overnight-to-drive (${a})`))) {
              throw new Error('Old run active jobs changed; no cancellation');
            }
            await github.rest.actions.cancelWorkflowRun({
              owner, repo, run_id: oldId
            });
            core.notice(`Requested cancellation of old Bitget run ${oldId} only. Drive untouched.`);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let i = 0; i < 24; i++) {
              await sleep(10000);
              const previous = await get(oldId);
              const corrected = await get(newId);
              core.info(JSON.stringify({
                event: 'bitget_handoff_observe', poll: i + 1,
                old_status: previous.status, old_conclusion: previous.conclusion,
                corrected_status: corrected.status, corrected_conclusion: corrected.conclusion
              }));
              if (previous.status === 'completed' && corrected.status !== 'pending' &&
                  corrected.status !== 'queued') {
                core.notice('Old lock released and corrected Bitget workflow advanced');
                break;
              }
            }
