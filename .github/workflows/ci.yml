name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rival
          POSTGRES_PASSWORD: rival
          POSTGRES_DB: rival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rival -d rival_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIVAL_TEST_DATABASE_URL: postgresql://rival:rival@127.0.0.1:5432/rival_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,archive]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
