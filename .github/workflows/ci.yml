name: CI

on:
  # The PR already tests each branch commit. Restrict push CI to main so
  # simultaneous push+PR check runs cannot cancel each other and mark a
  # successful PR unstable. Production release still gates on main CI.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Owner can retest and redeploy current main without dummy commits.

permissions:
  contents: read

# Prevent stale pushes to the same PR from occupying every runner slot.
# Keep main protected from cancellation; only supersede unmerged branch CI.
concurrency:
  group: rival-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rival
          POSTGRES_PASSWORD: rival
          POSTGRES_DB: rival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rival -d rival_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIVAL_TEST_DATABASE_URL: postgresql://rival:rival@127.0.0.1:5432/rival_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # LightGBM (sklearn API) trains the gbm_v1 test fixtures (tests/test_gbm_v1_shadow.py).
        # Only these two from the ml-research extra: the bot host never imports it.
        run: python -m pip install -e ".[dev,archive]" "lightgbm>=4.5,<5" "scikit-learn>=1.5,<2"
      - name: Lint
        run: ruff check .
      - name: Source-verification, spike causality and LFM3 repair regressions
        run: timeout 120s pytest -vv -x tests/test_private_llm_service.py tests/test_spike_challenger.py tests/test_verified_history_import_schedule.py
      - name: Test
        run: |
          # Surface a traceback if another async fixture hangs rather
          # than burning a whole CI runner without a useful diagnosis.
          PYTHONUNBUFFERED=1 timeout -s SIGINT -k 20s 480s \
            pytest -q -x -o faulthandler_timeout=75
