name: Deribit original 2021 trade bytes to private Drive

on:
  pull_request:
    paths:
      - ".github/workflows/deribit-2021-source-proof.yml"
      - "src/parlay_bot/research/deribit_trade_archive.py"
      - "tests/test_deribit_trade_archive.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deribit-2021-source-proof.yml"
      - "src/parlay_bot/research/deribit_trade_archive.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rival-deribit-original-2021-source
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e ".[dev,archive]"
          ruff check src/parlay_bot/research/deribit_trade_archive.py tests/test_deribit_trade_archive.py
          pytest -q tests/test_deribit_trade_archive.py

  source-byte-proof:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,archive]"
      - name: Verify warehouse credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - name: Archive actual original BTC and ETH 2021 trade minute
        run: python -m parlay_bot.research.deribit_trade_archive --day 2021-01-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deribit-2021-source-sha-receipt
          path: data/native-reports/deribit-2021-trade-source-proof.json
          retention-days: 14
          if-no-files-found: ignore
