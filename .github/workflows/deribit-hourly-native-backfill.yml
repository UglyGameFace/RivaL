name: Deribit historical original hourly trades to verified Drive

on:
  pull_request:
    paths:
      - ".github/workflows/deribit-hourly-native-backfill.yml"
      - "src/parlay_bot/research/deribit_hourly_backfill.py"
      - "tests/test_deribit_hourly_backfill.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deribit-hourly-native-backfill.yml"
      - "src/parlay_bot/research/deribit_hourly_backfill.py"
  workflow_dispatch:
    inputs:
      day:
        description: "Completed UTC original trade day"
        type: string
        default: "2021-01-02"
      hour:
        description: "Completed UTC hour (0-23)"
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: rival-deribit-old-hourly-trades
  cancel-in-progress: false

jobs:
  source-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e ".[dev,archive]"
          ruff check src/parlay_bot/research/deribit_hourly_backfill.py tests/test_deribit_hourly_backfill.py
          pytest -q tests/test_deribit_hourly_backfill.py tests/test_deribit_trade_archive.py

  source-backfill:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,archive]"
      - name: Verify private Drive configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - name: Archive original complete-source hourly BTC ETH trade partitions
        shell: bash
        run: |
          python -m parlay_bot.research.deribit_hourly_backfill \
            --day "${{ inputs.day || '2021-01-02' }}" \
            --hour "${{ inputs.hour || '0' }}" \
            --assets BTC ETH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deribit-original-hourly-readback-report
          path: data/native-reports/deribit-hourly-source-acquisition.json
          retention-days: 14
          if-no-files-found: ignore
