name: RivaL Production Release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Discloud's own GitHub Auto Deploy is the ONLY writer to the running app.
# Keep this workflow name as an event for downstream read-only evidence checks,
# but never upload or restart the bot here. Green CI is not deployment proof.
concurrency:
  group: rival-production-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-native-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require current first-party main CI
        id: gate
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ( "$SOURCE_EVENT" != "push" && "$SOURCE_EVENT" != "workflow_dispatch" ) ||
                "$SOURCE_BRANCH" != "main" || "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::notice::Not first-party successful main CI; native deployment check skipped."
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$SOURCE_SHA" != "$current_sha" ]]; then
            echo "::notice::Superseded main CI commit; native deployment check skipped."
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "check=true" >> "$GITHUB_OUTPUT"

      - name: Checkout exact passing main
        if: steps.gate.outputs.check == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.check == 'true'
        with:
          python-version: "3.11"

      - name: Verify native Discloud source parity
        if: steps.gate.outputs.check == 'true'
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: python tools/discloud_native_release.py

      - name: Verify deployed performance panels against PostgreSQL
        if: steps.gate.outputs.check == 'true'
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: python tools/discloud_performance_panels.py
