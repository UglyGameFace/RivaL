name: RivaL Production Release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
concurrency:
  # Serialize Discloud uploads. Superseded main commits are skipped when their
  # turn starts, rather than racing the live container during rapid merges.
  group: rival-production-release-main
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release source and owner credentials
        id: access
        shell: bash
        env:
          TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ( "$SOURCE_EVENT" != "push" && "$SOURCE_EVENT" != "workflow_dispatch" ) || "$SOURCE_BRANCH" != "main" || "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::notice::Not a verified first-party main push or manually dispatched main CI; deployment skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$TOKEN" || -z "$APP_ID" ]]; then
            echo "::warning::RivaL Discloud deployment not configured. Add DISCLOUD_TOKEN and DISCLOUD_APP_ID repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            # The tested commit must still be current main. No stale rollback
            # releases, and no concurrent Discloud stop/recreate operations.
            CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$SOURCE_SHA" != "$CURRENT_MAIN_SHA" ]]; then
              echo "::notice::Superseded main CI commit; skipping stale Discloud deployment."
              echo "ready=false" >> "$GITHUB_OUTPUT"
            else
              echo "ready=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout the exact passing commit
        if: steps.access.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate deployment files
        if: steps.access.outputs.ready == 'true'
        shell: bash
        run: |
          test -f discloud.config
          test -f main.py
          test -f requirements.txt
          test -f pyproject.toml
          test -f src/parlay_bot/discord_app/targeting.py
          test -f tools/unattended_acceptance.py
          test -f src/parlay_bot/perpetuals/acceptance_cli.py
          grep -q 'parlay_bot.perpetuals.acceptance_cli' main.py
          grep -q '^TYPE=bot$' discloud.config
          grep -q '^MAIN=main.py$' discloud.config

      - name: Stamp the deployed commit for error reports
        if: steps.access.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$SOURCE_SHA" > src/parlay_bot/RELEASE_SHA

      - name: Deploy tested RivaL app without replacing its host environment
        if: steps.access.outputs.ready == 'true'
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54  # v1 (pinned: holds DISCLOUD_TOKEN)
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ${{ secrets.DISCLOUD_APP_ID }}
          glob: |
            discloud.config
            main.py
            requirements.txt
            pyproject.toml
            src/**
            tools/unattended_acceptance.py
