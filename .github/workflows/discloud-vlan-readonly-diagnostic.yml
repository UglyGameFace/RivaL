name: One-time source-only LFM3 CPU budget deployment
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify only LLM Python service changed since validated binary
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3076e59c7cd8fe7955faa2f0152843557a90a86a HEAD
          CHANGED="$(git diff --name-only 1e809fed1c64f91f5f83f19c7504c059f1fda742 HEAD -- services/rival-llm)"
          test "$CHANGED" = "services/rival-llm/service.py"
          grep -q 'GENERATION_TOKENS = 140' services/rival-llm/service.py
      - uses: actions/download-artifact@v4
        with:
          name: RIVAL-LLM-UPLOAD-THIS-ZIP
          run-id: 41358911977
          github-token: ${{ github.token }}
          path: discloud-upload
      - name: Assemble and verify only updated Python service with identical pinned binary
        shell: bash
        run: |
          set -euo pipefail
          python services/rival-llm/validate_package.py discloud-upload
          cmp src/parlay_bot/perpetuals/evidence_policy.py discloud-upload/evidence_policy.py
          cmp services/rival-llm/discovery.py discloud-upload/discovery.py
          cmp services/rival-llm/main.py discloud-upload/main.py
          cp services/rival-llm/service.py discloud-upload/service.py
          python -m py_compile discloud-upload/service.py
          python services/rival-llm/validate_package.py discloud-upload
          (cd discloud-upload && zip -q -r ../llm-validated.zip .)
          python services/rival-llm/validate_package.py llm-validated.zip
          echo 'Validated source-only LLM update with retained pinned llama.cpp CPU binary'
      - name: Update only existing RivaL-Intelligence app
        shell: bash
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DISCLOUD_TOKEN" ] || [ -z "$DISCLOUD_APP_ID" ]; then exit 1; fi
          curl -fsS --max-time 30 -H "api-token: $DISCLOUD_TOKEN" \
            https://api.discloud.app/v2/app/all -o "$RUNNER_TEMP/apps.json"
          APP_ID="$(python - "$RUNNER_TEMP/apps.json" "$DISCLOUD_APP_ID" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f:data=json.load(f)
          found=[a for a in data.get("apps",[]) if isinstance(a,dict) and
                 str(a.get("name","")).casefold()=="rival-intelligence" and
                 str(a.get("id")) != sys.argv[2]]
          if len(found)!=1 or not found[0].get("id"):
              raise SystemExit("Refusing ambiguous/main app")
          print(found[0]["id"])
          PY
          )"
          STATUS="$(curl -sS --max-time 180 --retry 0 -o "$RUNNER_TEMP/commit.json" -w '%{http_code}' \
              -H "api-token: $DISCLOUD_TOKEN" -X PUT \
              -F "file.zip=@llm-validated.zip;type=application/zip" \
              "https://api.discloud.app/v2/app/$APP_ID/commit")"
          echo "RivaL-Intelligence source-only update HTTP $STATUS"
          test "$STATUS" = 200
          python - "$RUNNER_TEMP/commit.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f:d=json.load(f)
          if d.get("statusCode",200)>=400:raise SystemExit("Discloud commit rejected")
          print("Exact existing isolated LLM app accepted update")
          PY
