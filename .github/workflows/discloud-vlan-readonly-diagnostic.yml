name: RivaL real AI request failure inspection
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Diagnose real LFM3 request error class and unsummarized prompt size
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request,urllib.error,urllib.parse
          T=os.getenv("DISCLOUD_TOKEN","");M=os.getenv("DISCLOUD_APP_ID","")
          if not T or not M:raise SystemExit("No authenticated Discloud API")
          def api(path,method="GET",body=None):
           req=urllib.request.Request("https://api.discloud.app/v2"+path,
             data=json.dumps(body).encode() if body is not None else None,
             method=method,headers={"api-token":T,"Content-Type":"application/json"})
           try:
            with urllib.request.urlopen(req,timeout=75) as r:return json.load(r)
           except Exception as e:
            print("Discloud error class",type(e).__name__);return {}
          lst=api("/app/all").get("apps",[])
          llm=[a for a in lst if isinstance(a,dict) and a.get("name","").casefold()=="rival-intelligence"]
          if len(llm)!=1:raise SystemExit("Cannot locate LLM")
          for label,app in (("main",M),("llm",llm[0]["id"])):
           reply=api("/app/"+urllib.parse.quote(str(app),safe="")+"/logs")
           terminal=reply.get("apps",{}).get("terminal",{})
           raw=str(terminal.get("big") or terminal.get("small") or "")
           interesting=[line for line in raw.splitlines() if
               ("inference rejected class=" in line
                or "Local inference unavailable HTTP" in line
                or "Local AI rejected request HTTP" in line
                or "Private local AI network unavailable" in line
                or "prompt eval time" in line or "total time =" in line
                or "http_status=503" in line or "http_status=422" in line)]
           print("Recent redacted",label,"log patterns",[
               line[-170:] for line in interesting[-12:]])
          script="""import json,os,sys
          sys.path.insert(0,os.path.abspath("src"))
          from parlay_bot.config import Settings
          from parlay_bot.storage.hot import PostgresHotStore
          from parlay_bot.perpetuals.market_store import PerpetualMarketStore
          from parlay_bot.perpetuals.analysis_evidence import build_evidence
          from parlay_bot.discord_app.data_dashboard import MARKET_SYMBOLS
          settings=Settings()
          store=PostgresHotStore(settings.rival_database_url.get_secret_value())
          try:
           evidence,digest=build_evidence(PerpetualMarketStore(store),asset="BTC",
               venues=tuple(MARKET_SYMBOLS))
           serialized=json.dumps(evidence,sort_keys=True,separators=(",",":"))
           sizes={name:len(json.dumps(value)) for name,value in evidence.items()}
           source_sizes=[{"venue":x.get("venue"),"chars":len(json.dumps(x)),
           "window_labels":list(x.get("windows",{})),
           "historical_count":len(x.get("historical_windows",{}))}
           for x in evidence.get("sources",[])]
           print("RIVAL_EVIDENCE_SIZES="+json.dumps({"full_chars":len(serialized),
               "source_count":len(source_sizes),"field_sizes":sizes,
               "source_lengths":source_sizes},sort_keys=True))
          finally:store.close()
          """
          cmd="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(script.encode()).decode()+"\"))'"
          res=api("/app/"+urllib.parse.quote(M,safe="")+"/console","PUT",{"command":cmd})
          stdout=str(res.get("apps",{}).get("shell",{}).get("stdout",""))
          marker="RIVAL_EVIDENCE_SIZES="
          if marker in stdout:
           print("Production evidence payload",stdout.split(marker,1)[1].splitlines()[0])
          else:
           print("No structured evidence-size result; stderr present",bool(res.get("apps",{}).get("shell",{}).get("stderr")))
          PY
