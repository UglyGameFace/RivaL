name: RivaL validated evidence-grounding LLM package deployment
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
  actions: read
jobs:
  deploy-isolated-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require merged tested changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0b8c46a4202437398776629c4e1f39c14c539106 HEAD
          test -f src/parlay_bot/perpetuals/evidence_policy.py
      - uses: actions/download-artifact@v4
        with:
          name: RIVAL-LLM-UPLOAD-THIS-ZIP
          run-id: 41356392560
          github-token: ${{ github.token }}
          path: discloud-upload
      - name: Validate downloaded Python 3.11 package
        shell: bash
        run: |
          set -euo pipefail
          python services/rival-llm/validate_package.py discloud-upload
          cmp src/parlay_bot/perpetuals/evidence_policy.py discloud-upload/evidence_policy.py
          (cd discloud-upload && zip -q -r ../llm-validated.zip .)
          python services/rival-llm/validate_package.py llm-validated.zip
          python -m py_compile discloud-upload/evidence_policy.py
      - name: Update only existing RivaL-Intelligence
        shell: bash
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DISCLOUD_TOKEN" ] || [ -z "$DISCLOUD_APP_ID" ]; then
            echo "::error::Missing existing Discloud credentials"
            exit 1
          fi
          curl -fsS --max-time 30 -H "api-token: $DISCLOUD_TOKEN" \
            https://api.discloud.app/v2/app/all -o "$RUNNER_TEMP/apps.json"
          APP_ID="$(python - "$RUNNER_TEMP/apps.json" "$DISCLOUD_APP_ID" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: data=json.load(f)
          matches=[a for a in data.get("apps",[]) if
                   isinstance(a,dict) and
                   str(a.get("name","")).casefold()=="rival-intelligence" and
                   str(a.get("id")) != sys.argv[2]]
          if len(matches)!=1 or not matches[0].get("id"):
              raise SystemExit("Refusing upload: isolated app not uniquely identified")
          print(matches[0]["id"])
          PY
          )"
          test -n "$APP_ID"
          STATUS="$(curl -sS --max-time 180 --retry 0 -o "$RUNNER_TEMP/commit.json" -w '%{http_code}' \
            -H "api-token: $DISCLOUD_TOKEN" -X PUT \
            -F "file.zip=@llm-validated.zip;type=application/zip" \
            "https://api.discloud.app/v2/app/$APP_ID/commit")"
          echo "Isolated LLM update HTTP $STATUS"
          if [ "$STATUS" != 200 ]; then
            echo "::error::Isolated LLM package update did not return HTTP 200"
            exit 1
          fi
          python - "$RUNNER_TEMP/commit.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: value=json.load(f)
          if value.get("statusCode",200)>=400:
              raise SystemExit("Discloud rejected isolated app commit")
          print("Isolated evidence-grounding package update acknowledged")
          PY
