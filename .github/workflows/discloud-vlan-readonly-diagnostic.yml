name: One-time private Discloud VLAN diagnosis
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check current Discloud subnet membership and private paths
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          TOKEN=os.getenv("DISCLOUD_TOKEN","");MAIN=os.getenv("DISCLOUD_APP_ID","")
          def api(p,method="GET",body=None):
           req=urllib.request.Request("https://api.discloud.app/v2"+p,method=method,
            data=json.dumps(body).encode() if body is not None else None,
            headers={"api-token":TOKEN,"Content-Type":"application/json"})
           try:
            with urllib.request.urlopen(req,timeout=50) as r:return json.loads(r.read(100000))
           except Exception as e:print("Discloud API",type(e).__name__);return {}
          apps=api("/app/all").get("apps",[]) if TOKEN else []
          llm=[a for a in apps if isinstance(a,dict) and a.get("name","").lower()=="rival-intelligence"]
          if not MAIN or len(llm)!=1:raise SystemExit("Missing app access")
          remote="""import socket,fcntl,struct,ipaddress,json
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          out={}
          for interface in ("eth0","eth1"):
           try:
            ip=socket.inet_ntoa(fcntl.ioctl(s.fileno(),0x8915,struct.pack("256s",interface.encode()))[20:24])
            mask=socket.inet_ntoa(fcntl.ioctl(s.fileno(),0x891b,struct.pack("256s",interface.encode()))[20:24])
            out[interface]={"ip":ip,"mask":mask}
           except OSError:out[interface]={"error":"missing"}
          s.close()
          print("RIVAL_NET="+json.dumps(out))
          """
          def console(appid,script,extra=""):
           cmd="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(script.encode()).decode()+"\"))'"+(" "+extra if extra else "")
           v=api("/app/"+urllib.parse.quote(str(appid),safe="")+"/console","PUT",{"command":cmd})
           out=str(v.get("apps",{}).get("shell",{}).get("stdout",""))
           if "RIVAL_NET=" not in out:return None
           try:return json.loads(out.split("RIVAL_NET=",1)[1].splitlines()[0])
           except Exception:return None
          main=console(MAIN,remote);other=console(llm[0]["id"],remote)
          if not main or not other:raise SystemExit("Network address information unavailable")
          import ipaddress
          for iface in ("eth0","eth1"):
           a,b=main.get(iface,{}),other.get(iface,{})
           if "ip" not in a or "ip" not in b:
            print(iface,"missing")
            continue
           an=ipaddress.ip_network(a["ip"]+"/"+a["mask"],strict=False)
           bn=ipaddress.ip_network(b["ip"]+"/"+b["mask"],strict=False)
           print(iface,"same_subnet",an==bn,"main_net",str(an),"llm_net",str(bn))
          # No bearer token is sent in this test. Probe only the authenticated account's app IPs on the previously observed Discloud 172.4/172.5 network.
          probe="""import json,sys,urllib.request,urllib.error,ipaddress,time
          ip=sys.argv[1];address=ipaddress.ip_address(ip)
          out={"target_discloud_range":address in ipaddress.ip_network("172.4.0.0/15")}
          if out["target_discloud_range"]:
           t=time.monotonic()
           try:
            with urllib.request.urlopen("http://"+ip+":8765/health",timeout=3) as r:
             data=json.loads(r.read(2000))
             out["http"]=r.status;out["status"]=data.get("status")
           except Exception as e:out["error_class"]=type(e).__name__
           out["elapsed"]=round(time.monotonic()-t,2)
          print("RIVAL_NET="+json.dumps(out))
          """
          for iface in ("eth0","eth1"):
           if "ip" in other.get(iface,{}):
            result=console(MAIN,probe,other[iface]["ip"])
            print("main_to_llm",iface,result)
          PY
