name: One-time actual RivaL LFM3 database acceptance
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call deployed normal LocalFirstResearch through quota-protected DB
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          token=os.getenv("DISCLOUD_TOKEN","");appid=os.getenv("DISCLOUD_APP_ID","")
          if not token or not appid:raise SystemExit("Missing existing credentials")
          cmd="python -c 'import sys;sys.path.insert(0,\"src\");from parlay_bot.perpetuals.llm_persistence_acceptance import main;main()'"
          req=urllib.request.Request("https://api.discloud.app/v2/app/"+urllib.parse.quote(appid,safe="")+"/console",
           data=json.dumps({"command":cmd}).encode(),method="PUT",headers={"api-token":token,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=130) as r:d=json.load(r)
          out=str(d.get("apps",{}).get("shell",{}).get("stdout",""))
          err=str(d.get("apps",{}).get("shell",{}).get("stderr",""))
          mark="RIVAL_LFM3_PERSISTENCE_RECEIPT="
          if mark not in out:
           print("No receipt; stderr_present",bool(err),"classifications",[line[-160:] for line in err.splitlines()[-5:]])
           raise SystemExit(1)
          result=json.loads(out.split(mark,1)[1].splitlines()[0])
          print("Post-cooldown ordinary research PostgreSQL receipt",json.dumps(result,sort_keys=True))
          if result.get("outcome")=="failed":raise SystemExit(1)
          PY
