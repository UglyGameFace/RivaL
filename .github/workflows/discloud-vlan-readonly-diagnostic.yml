name: Verify candidate admission provenance in production
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check actual Postgres migration historical selection and retained screening
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: |
          python - <<'PY'
          import json,os,base64,urllib.request,urllib.parse
          token=os.environ.get('DISCLOUD_TOKEN','');app=os.environ.get('DISCLOUD_APP_ID','')
          if not token or not app:raise SystemExit('No existing Discloud credentials')
          script="import json,os,sys\nsys.path.insert(0,os.path.abspath(\"src\"))\nfrom parlay_bot.config import Settings\nfrom parlay_bot.research.candidate_registry import ResearchCandidateRegistry\nfrom parlay_bot.storage.hot import PostgresHotStore\ns=Settings();out={\"backend\":s.rival_storage_backend}\nif s.rival_storage_backend==\"postgres\" and s.rival_database_url is not None:\n db=PostgresHotStore(s.rival_database_url.get_secret_value())\n try:\n  reg=ResearchCandidateRegistry(db)\n  reg.initialize()\n  out[\"inventory\"]=reg.inventory_receipt()\n  out[\"btc5\"]=reg.summary(asset=\"BTC\",horizon=5,live_venues=(\"okx\",\"gate\",\"bitget\",\"binance\"))\n  out[\"xrp15\"]=reg.summary(asset=\"XRP\",horizon=15,live_venues=(\"okx\",\"gate\",\"bitget\"))\n  for name in (\"btc5\",\"xrp15\"):\n   item=out[name]\n   out[name]={\"slot_imported\":item[\"slot_imported\"],\n    \"slot_compatible\":item[\"slot_compatible\"],\n    \"slot_passed\":item[\"slot_passed\"],\n    \"active_offline_model\":item[\"active_offline_model\"],\n    \"admission_reasons\":item.get(\"admission_reasons\"),\n    \"selection_contract\":item[\"historical_selection\"][\"contract\"] if item.get(\"historical_selection\") else None,\n    \"selection_reason\":item.get(\"reason\")}\n  with db.connect() as con:\n   out[\"column_present\"]=\"admission_reason\" in db.database.column_names(con,\"rival_offline_candidates\")\n   out[\"admission_reason_summary\"]=[dict(r) for r in con.execute(\n    \"SELECT COALESCE(admission_reason,'legacy_reason_unreported') AS reason,\"\n    \" COUNT(*) AS n FROM rival_offline_candidates\"\n    \" GROUP BY COALESCE(admission_reason,'legacy_reason_unreported')\"\n    \" ORDER BY n DESC LIMIT 12\"\n    ).fetchall()]\n except Exception as exc:out[\"error_class\"]=type(exc).__name__\n finally:db.close()\nprint(\"RIVAL_MODEL_SCREEN_RELEASE=\"+json.dumps(out,sort_keys=True,default=str))\n"
          cmd="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(script.encode()).decode()+"\"))'"
          req=urllib.request.Request('https://api.discloud.app/v2/app/'+urllib.parse.quote(app,safe='')+'/console',
           data=json.dumps({'command':cmd}).encode(),method='PUT',
           headers={'api-token':token,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=80) as r:d=json.load(r)
          stdout=str(d.get('apps',{}).get('shell',{}).get('stdout',''))
          if 'RIVAL_MODEL_SCREEN_RELEASE=' not in stdout:
           print('No production model screen receipt; stderr-present',bool(d.get('apps',{}).get('shell',{}).get('stderr')));raise SystemExit(1)
          data=json.loads(stdout.split('RIVAL_MODEL_SCREEN_RELEASE=',1)[1].splitlines()[0])
          print('Actual PostgreSQL candidate screen release',json.dumps(data,sort_keys=True))
          if not data.get('column_present') or 'error_class' in data:
           raise SystemExit('Production admission reason migration unverified')
          PY
