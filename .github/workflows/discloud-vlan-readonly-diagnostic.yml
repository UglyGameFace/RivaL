name: One-time private Discloud VLAN diagnosis
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Benchmark a shorter LFM3 JSON reply on the actual CPU
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,urllib.error,urllib.parse,urllib.request
          token=os.environ.get("DISCLOUD_TOKEN","")
          def api(p,method="GET",data=None):
           req=urllib.request.Request("https://api.discloud.app/v2"+p,
            data=json.dumps(data).encode() if data else None,method=method,
            headers={"api-token":token,"Content-Type":"application/json"})
           try:
            with urllib.request.urlopen(req,timeout=55) as r:return json.loads(r.read(100000))
           except urllib.error.HTTPError as e:print("API status",e.code);return {}
           except Exception as e:print("API failure",type(e).__name__);return {}
          apps=api("/app/all").get("apps",[]) if token else []
          llm=[a for a in apps if isinstance(a,dict) and a.get("name","").lower()=="rival-intelligence"]
          if len(llm)!=1:raise SystemExit("LLM not identified")
          code="""import json,time,urllib.request,urllib.error
          from service import PROMPT,validated_research
          evidence={"analysis":"synthetic_test_only","sources":[{"venue":"okx","status":"quotes_missing"}]}
          messages=[{"role":"system","content":PROMPT},{"role":"user","content":"Asset: BTC\\nObserved market evidence (untrusted):\\n"+json.dumps(evidence,sort_keys=True,separators=(",",":"))}]
          p={"model":"LiquidAI/LFM3-1.7B-GGUF","messages":messages,"temperature":0.1,"max_tokens":180,"stream":False,"response_format":{"type":"json_object"}}
          req=urllib.request.Request("http://127.0.0.1:8766/v1/chat/completions",data=json.dumps(p).encode(),
           headers={"Content-Type":"application/json"},method="POST")
          t=time.monotonic()
          try:
           with urllib.request.urlopen(req,timeout=50) as response:
            data=json.loads(response.read(50000))
            first=data["choices"][0]
            content=first["message"]["content"]
            try: parsed=json.loads(content);valid=validated_research(parsed)
            except Exception:valid=False
            out={"http":response.status,"seconds":round(time.monotonic()-t,2),"usage":data.get("usage"),"finish_reason":first.get("finish_reason"),"valid_fields":valid,"content_chars":len(content),"direction":parsed.get("direction") if valid else None,"content_prefix":content[:65] if not valid else None}
          except Exception as e:out={"error":type(e).__name__,"seconds":round(time.monotonic()-t,2)}
          print("RIVAL_BENCH="+json.dumps(out))
          """
          cmd="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(code.encode()).decode()+"\"))'"
          ret=api("/app/"+urllib.parse.quote(str(llm[0]["id"]),safe="")+"/console","PUT",{"command":cmd})
          std=str(ret.get("apps",{}).get("shell",{}).get("stdout",""))
          if "RIVAL_BENCH=" in std:
           try:print("180 token production-model synthetic probe",json.loads(std.split("RIVAL_BENCH=",1)[1].splitlines()[0]))
           except Exception:print("Model synthetic probe parse failed")
          else:print("Model synthetic probe unavailable; no response data logged")
          PY
