name: One-time validated LFM3 real-evidence CPU repair deployment
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
  actions: read
jobs:
  deploy-isolated-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require exact merged tested source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 51271feeb39cd5f87eb357a1829d7f3176825485 HEAD
          grep -q 'def compact_evidence' services/rival-llm/service.py
      - uses: actions/download-artifact@v4
        with:
          name: RIVAL-LLM-UPLOAD-THIS-ZIP
          run-id: 41358911977
          github-token: ${{ github.token }}
          path: discloud-upload
      - name: Validate downloaded package matches merged code
        run: |
          set -euo pipefail
          python services/rival-llm/validate_package.py discloud-upload
          cmp services/rival-llm/service.py discloud-upload/service.py
          cmp src/parlay_bot/perpetuals/evidence_policy.py discloud-upload/evidence_policy.py
          (cd discloud-upload && zip -q -r ../llm-validated.zip .)
          python services/rival-llm/validate_package.py llm-validated.zip
      - name: Update only pre-existing Intelligence app
        shell: bash
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DISCLOUD_TOKEN" ] || [ -z "$DISCLOUD_APP_ID" ]; then
            echo "::error::Discloud deployment secrets are missing"
            exit 1
          fi
          curl -fsS --max-time 30 -H "api-token: $DISCLOUD_TOKEN" \
            https://api.discloud.app/v2/app/all -o "$RUNNER_TEMP/apps.json"
          APP_ID="$(python - "$RUNNER_TEMP/apps.json" "$DISCLOUD_APP_ID" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f: data=json.load(f)
          found=[a for a in data.get("apps",[]) if isinstance(a,dict) and
                 str(a.get("name","")).casefold()=="rival-intelligence" and
                 str(a.get("id")) != sys.argv[2]]
          if len(found)!=1 or not found[0].get("id"):
              raise SystemExit("Refusing ambiguous or main app target")
          print(found[0]["id"])
          PY
          )"
          STATUS="$(curl -sS --max-time 180 --retry 0 -o "$RUNNER_TEMP/commit.json" -w '%{http_code}' \
              -H "api-token: $DISCLOUD_TOKEN" -X PUT \
              -F "file.zip=@llm-validated.zip;type=application/zip" \
              "https://api.discloud.app/v2/app/$APP_ID/commit")"
          echo "Isolated LFM3 update status HTTP $STATUS"
          if [ "$STATUS" != 200 ]; then
            echo "::error::Isolated LFM3 update did not succeed"
            exit 1
          fi
          python - "$RUNNER_TEMP/commit.json" <<'PY'
          import json,sys
          with open(sys.argv[1]) as f:result=json.load(f)
          if result.get("statusCode",200)>=400:
              raise SystemExit("Discloud refused the update")
          print("Existing RivaL-Intelligence package accepted")
          PY
