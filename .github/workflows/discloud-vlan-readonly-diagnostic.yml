name: One-time RivaL native model hold reasons
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read latest historical model selection and paper promotion blockers
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: |
          python - <<'PY'
          import json,os,base64,urllib.request,urllib.parse
          t=os.environ['DISCLOUD_TOKEN'];app=os.environ['DISCLOUD_APP_ID']
          script="import json,os,sys\nsys.path.insert(0,os.path.abspath(\"src\"))\nfrom parlay_bot.config import Settings\nfrom parlay_bot.storage.hot import PostgresHotStore\ns=Settings()\nr={}\nstore=PostgresHotStore(s.rival_database_url.get_secret_value())\ntry:\n with store.connect() as con:\n  queries={\n   \"selection_reasons\":\"SELECT reason,COUNT(*) AS n FROM rival_history_selection GROUP BY reason ORDER BY n DESC LIMIT 12\",\n   \"candidate_screens\":\"SELECT retrospective_screen,COUNT(*) AS n,MAX(source_months) AS max_source_months, SUM(CASE WHEN active_live=1 THEN 1 ELSE 0 END) AS live FROM rival_offline_candidates GROUP BY retrospective_screen ORDER BY n DESC LIMIT 12\",\n   \"promotion_reasons\":\"SELECT reason,COUNT(*) AS n FROM perp_model_promotion WHERE evaluated_at >= '2026-10-31' GROUP BY reason ORDER BY n DESC LIMIT 8\",\n  }\n  for k,q in queries.items():\n   try:\n    items=[dict(x) for x in con.execute(q).fetchall()]\n    for item in items:\n     if \"reason\" in item:item[\"reason\"]=str(item[\"reason\"])[:220]\n    r[k]=items\n   except Exception as e:r[k+\"_error\"]=type(e).__name__\nfinally:store.close()\nprint(\"RIVAL_MODEL_HOLDS=\"+json.dumps(r,sort_keys=True))\n"
          cmd="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(script.encode()).decode()+"\"))'"
          q=urllib.request.Request('https://api.discloud.app/v2/app/'+urllib.parse.quote(app,safe='')+'/console',
            method='PUT',data=json.dumps({'command':cmd}).encode(),headers={'api-token':t,'Content-Type':'application/json'})
          with urllib.request.urlopen(q,timeout=65) as resp:obj=json.load(resp)
          stdout=str(obj.get('apps',{}).get('shell',{}).get('stdout',''))
          if 'RIVAL_MODEL_HOLDS=' not in stdout:
           print('no result; stderr_present',bool(obj.get('apps',{}).get('shell',{}).get('stderr')));raise SystemExit(1)
          print('Live model admission blocker groups',stdout.split('RIVAL_MODEL_HOLDS=',1)[1].splitlines()[0])
          PY
