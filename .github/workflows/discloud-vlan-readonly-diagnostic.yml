name: One-time private Discloud VLAN diagnosis
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current RivaL research provider mode without reading secrets
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request,urllib.parse
          token=os.environ.get("DISCLOUD_TOKEN","");appid=os.environ.get("DISCLOUD_APP_ID","")
          if not token or not appid:raise SystemExit("Deployment credentials unavailable")
          code="""import os,json
          print("RIVAL_ENV="+json.dumps({"provider":os.getenv("RIVAL_AI_PROVIDER","disabled"),"local_token_configured":bool(os.getenv("RIVAL_LOCAL_AI_TOKEN")),"background_opt_in":os.getenv("RIVAL_AI_BACKGROUND_OPT_IN","false"),"cloudflare_backup_configured":bool(os.getenv("RIVAL_CLOUDFLARE_AI_TOKEN"))}))
          """
          cmd="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(code.encode()).decode()+"\"))'"
          req=urllib.request.Request("https://api.discloud.app/v2/app/"+urllib.parse.quote(appid,safe="")+"/console",method="PUT",data=json.dumps({"command":cmd}).encode(),headers={"api-token":token,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as r:reply=json.load(r)
          out=reply.get("apps",{}).get("shell",{}).get("stdout","")
          if "RIVAL_ENV=" in out:print("RivaL provider configuration",out.split("RIVAL_ENV=",1)[1].splitlines()[0])
          else:print("Provider status unavailable")
          PY
