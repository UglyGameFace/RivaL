name: RivaL verified private LLM discovery acceptance
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify deployed main bot discovers LLM without DNS or hardcoded IP
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request
          TOKEN=os.getenv("DISCLOUD_TOKEN","")
          MAIN=os.getenv("DISCLOUD_APP_ID","")
          if not TOKEN or not MAIN:
              raise SystemExit("Missing existing Discloud credentials")
          
          def console(source):
              command="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(source.encode()).decode()+"\"))'"
              req=urllib.request.Request(
                  "https://api.discloud.app/v2/app/"+urllib.parse.quote(MAIN,safe="")+"/console",
                  data=json.dumps({"command":command}).encode(),method="PUT",
                  headers={"api-token":TOKEN,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=85) as response:
                      result=json.load(response)
              except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError,ValueError) as exc:
                  print("Discloud console transport",type(exc).__name__)
                  return {}
              out=str(result.get("apps",{}).get("shell",{}).get("stdout",""))
              if "RIVAL_DISCOVERY_ACCEPTANCE=" not in out:
                  return {"console_result":"unavailable"}
              try:return json.loads(out.split("RIVAL_DISCOVERY_ACCEPTANCE=",1)[1].splitlines()[0])
              except (ValueError,IndexError):return {"console_result":"malformed"}
          
          source="""import json,os,pathlib,sys,time,urllib.request,urllib.error
          src=pathlib.Path.cwd()/"src"
          sys.path.insert(0,str(src))
          out={"client_installed":(src/"parlay_bot/perpetuals/local_llm_discovery.py").is_file(),
          "provider":os.getenv("RIVAL_AI_PROVIDER","disabled"),"token_present":bool(os.getenv("RIVAL_LOCAL_AI_TOKEN"))}
          if out["client_installed"] and out["token_present"]:
           try:
            from parlay_bot.perpetuals.local_llm_discovery import discover_private_llm
            ip=discover_private_llm(os.environ["RIVAL_LOCAL_AI_TOKEN"])
            out["authenticated_discovery"]=bool(ip)
            if ip:
             def call(path,body=None,timeout=10):
              req=urllib.request.Request("http://"+ip+":8765"+path,
               data=json.dumps(body).encode() if body is not None else None,
               headers={"Authorization":"Bearer "+os.environ["RIVAL_LOCAL_AI_TOKEN"],
                        "Content-Type":"application/json"},method="POST" if body is not None else "GET")
              begin=time.monotonic()
              try:
               with urllib.request.urlopen(req,timeout=timeout) as response:
                data=json.loads(response.read(10000))
                return {"http":response.status,"elapsed":round(time.monotonic()-begin,2),
                        "ready":data.get("ready"),"direction":data.get("direction"),
                        "model_present":bool(data.get("model")),
                        "thesis_present":bool(str(data.get("thesis") or "").strip()),
                        "risk_present":bool(str(data.get("risk") or "").strip()),
                        "informational_only":data.get("informational_only"),
                        "uncalibrated":data.get("uncalibrated")}
              except urllib.error.HTTPError as e:return {"http":e.code}
              except Exception as e:return {"error_class":type(e).__name__}
             out["status"]=call("/v1/status",timeout=5)
             if out["status"].get("http")==200 and out["status"].get("ready"):
              out["research"]=call("/v1/research",{"asset":"BTC","evidence":{"analysis":"synthetic_discovery_acceptance_only","sources":[{"venue":"okx","status":"quotes_missing"}]}},timeout=55)
           except Exception as e:out["diagnostic_error_class"]=type(e).__name__
          print("RIVAL_DISCOVERY_ACCEPTANCE="+json.dumps(out,sort_keys=True))
          """
          last={}
          for attempt in range(26):
              last=console(source)
              if last.get("client_installed") and last.get("authenticated_discovery") and last.get("status",{}).get("ready"):
                  break
              time.sleep(10)
          print("Authenticated production main-to-LLM result:",json.dumps(last,sort_keys=True))
          research=last.get("research") or {}
          if not (last.get("provider")=="local" and last.get("authenticated_discovery") and
                  research.get("http")==200 and research.get("model_present") and
                  research.get("informational_only") is True and research.get("uncalibrated") is True and
                  research.get("thesis_present") and research.get("risk_present")):
              raise SystemExit("End-to-end authenticated discovery acceptance FAILED")
          print("PASS: production main RivaL autonomously discovered and used private LFM3")
          PY
