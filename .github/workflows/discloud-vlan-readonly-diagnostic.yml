name: One-time private Discloud VLAN diagnosis

on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe private interfaces without changing app config
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, ipaddress, json, os, socket, urllib.error, urllib.parse, urllib.request
          TOKEN = os.environ.get("DISCLOUD_TOKEN", "")
          MAIN = os.environ.get("DISCLOUD_APP_ID", "")
          BASE = "https://api.discloud.app/v2"
          def api(path, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(BASE+path,data=data,method=method,
                  headers={"api-token":TOKEN,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=40) as response:
                      return json.loads(response.read(100000))
              except urllib.error.HTTPError as exc:
                  print("Discloud API HTTP status",exc.code)
                  return None
              except Exception as exc:
                  print("Discloud API transport",type(exc).__name__)
                  return None
          catalog=api("/app/all") if TOKEN and MAIN else None
          apps=catalog.get("apps",[]) if isinstance(catalog,dict) else []
          llms=[a for a in apps if isinstance(a,dict) and str(a.get("name","")).casefold()=="rival-intelligence"]
          if len(llms)!=1 or not MAIN:
              print("Cannot resolve both applications via existing deployment credentials")
              raise SystemExit(0)
          remote="""import json,socket,fcntl,struct
          s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
          r={}
          for n in ("eth0","eth1"):
           try:
            ip=socket.inet_ntoa(fcntl.ioctl(s.fileno(),0x8915,struct.pack("256s",n.encode()))[20:24])
            mask=socket.inet_ntoa(fcntl.ioctl(s.fileno(),0x891b,struct.pack("256s",n.encode()))[20:24])
            r[n]={"ip":ip,"netmask":mask}
           except OSError:r[n]={"error":"unavailable"}
          s.close()
          print("RIVAL_VLAN_ADDR="+json.dumps(r,sort_keys=True))
          """
          def console(app_id,command):
              response=api("/app/"+urllib.parse.quote(str(app_id),safe="")+"/console","PUT",{"command":command})
              shell=(response or {}).get("apps",{}).get("shell",{})
              return str(shell.get("stdout","")) if isinstance(shell,dict) else ""
          cmd="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(remote.encode()).decode()+"\"))'"
          data={}
          for name, appid in (("main",MAIN),("llm",llms[0]["id"])):
              output=console(appid,cmd)
              marker="RIVAL_VLAN_ADDR="
              if marker not in output:
                  print(name,"interface diagnostic unavailable")
                  continue
              try:data[name]=json.loads(output.split(marker,1)[1].splitlines()[0])
              except (ValueError,IndexError):
                  print(name,"interface diagnostic parse error")
          if not all(x in data and isinstance(data[x].get("eth1",{}).get("ip"),str) for x in ("main","llm")):
              print("Insufficient private-interface data; no changes attempted")
              raise SystemExit(0)
          for iface in ("eth0","eth1"):
              try:
                  left=ipaddress.ip_network(data["main"][iface]["ip"]+"/"+data["main"][iface]["netmask"],strict=False)
                  right=ipaddress.ip_network(data["llm"][iface]["ip"]+"/"+data["llm"][iface]["netmask"],strict=False)
                  print(iface,"same_subnet",left==right,"network_prefix",str(left.network_address).rsplit(".",1)[0],
                        "netmask",str(left.netmask),"llm_global",ipaddress.ip_address(data["llm"][iface]["ip"]).is_global)
              except (ValueError,KeyError):
                  print(iface,"network_unknown")
          remote_probe="""import json,socket,sys
          ip=sys.argv[1]
          try:
           with socket.create_connection((ip,8765),timeout=4) as s:
            s.sendall(b"GET /health HTTP/1.0\\r\\nHost: rival-llm\\r\\nConnection: close\\r\\n\\r\\n")
            s.settimeout(4)
            reply=s.recv(256)
            print("RIVAL_VLAN_PROBE="+json.dumps({"connected":True,"http_ok":b" 200 " in reply[:32]}))
          except (OSError,TimeoutError) as e:
           print("RIVAL_VLAN_PROBE="+json.dumps({"connected":False,"error_class":type(e).__name__}))
          """
          for iface in ("eth0","eth1"):
              address=data["llm"][iface]["ip"]
              if ipaddress.ip_address(address).is_global:
                  print(iface,"refusing globally routable IP probe")
                  continue
              # Only request the documented unauthenticated /health endpoint, without secrets.
              probe="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(remote_probe.encode()).decode()+"\"))' "+address
              stdout=console(MAIN,probe)
              marker="RIVAL_VLAN_PROBE="
              if marker not in stdout:
                  print(iface,"probe unavailable")
                  continue
              try:print(iface,"main_to_llm",json.loads(stdout.split(marker,1)[1].splitlines()[0]))
              except (ValueError,IndexError):print(iface,"probe parse error")
          PY
