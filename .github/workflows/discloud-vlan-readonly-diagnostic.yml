name: One-time private Discloud VLAN diagnosis
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check isolated service token persistence without reading values
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,urllib.error,urllib.parse,urllib.request
          T=os.getenv("DISCLOUD_TOKEN","")
          def api(path,method="GET",body=None):
           req=urllib.request.Request("https://api.discloud.app/v2"+path,method=method,
             data=json.dumps(body).encode() if body else None,
             headers={"api-token":T,"Content-Type":"application/json"})
           try:
            with urllib.request.urlopen(req,timeout=40) as r:return json.loads(r.read(100000))
           except Exception as e:print("API error",type(e).__name__);return {}
          apps=api("/app/all").get("apps",[]) if T else []
          llm=[x for x in apps if isinstance(x,dict) and x.get("name","").lower()=="rival-intelligence"]
          if len(llm)!=1:raise SystemExit("LLM app not uniquely found")
          code="""import os,pathlib,json
          print("RIVAL_DIAG_RESULT="+json.dumps({"runtime_secret_in_host_environment":bool(os.environ.get("RIVAL_LLM_SHARED_TOKEN")),"private_env_file_present":pathlib.Path(".env").is_file(),"model_file_cached":any(pathlib.Path("runtime/models").glob("*.gguf"))}))
          """
          cmd="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(code.encode()).decode()+"\"))'"
          a=api("/app/"+urllib.parse.quote(llm[0]["id"],safe="")+"/console","PUT",{"command":cmd})
          stdout=str(a.get("apps",{}).get("shell",{}).get("stdout",""))
          if "RIVAL_DIAG_RESULT=" in stdout:
           print("Secret provenance without disclosure",json.loads(stdout.split("RIVAL_DIAG_RESULT=",1)[1].splitlines()[0]))
          else:print("Secret provenance unavailable")
          PY
