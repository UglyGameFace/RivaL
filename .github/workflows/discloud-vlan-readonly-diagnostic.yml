name: RivaL live LLM post-deploy prompt tokens and timeout diagnosis
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check effective post-deploy gateway code and real backend token budget
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request,urllib.parse
          T=os.getenv("DISCLOUD_TOKEN","")
          if not T:raise SystemExit("No Discloud credential")
          def api(path,method="GET",body=None):
           req=urllib.request.Request("https://api.discloud.app/v2"+path,method=method,
             data=json.dumps(body).encode() if body else None,
             headers={"api-token":T,"Content-Type":"application/json"})
           with urllib.request.urlopen(req,timeout=75) as r:return json.load(r)
          apps=api("/app/all").get("apps",[])
          llm=[a for a in apps if isinstance(a,dict) and a.get("name","").casefold()=="rival-intelligence"]
          if len(llm)!=1:raise SystemExit("Missing isolated LLM")
          path="/app/"+urllib.parse.quote(str(llm[0]["id"]),safe="")
          r=api(path+"/logs")
          terminal=r.get("apps",{}).get("terminal",{})
          logs=str(terminal.get("big") or terminal.get("small") or "")
          lines=logs.splitlines()
          selected=[s for s in lines if any(term in s for term in
           ("inference rejected class=", "http_status=503","http_status=422",
            "prompt eval time", "eval time =", "total time =", "llama_server"))]
          print("LLM error/timing lines", [s[-220:] for s in selected[-22:]])
          source="""import json,os,urllib.request
          from service import compact_evidence,PROMPT,GENERATION_TOKENS
          sources=[]
          for v in ("hyperliquid","dydx","bitget","gate","okx","kucoin",
                    "deribit","lighter","phemex"):
           sources.append({"venue":v,"quote":"USDT",
            "windows":{"5m":{"return_pct":0.15},
                       "15m":{"return_pct":-0.08},
                       "1h":{"return_pct":0.20}},
            "historical_windows":{"7d":{"return_pct":0.5}},
            "available_bars":289})
          evidence={"asset":"BTC","analysis":"unvalidated_research","sources":sources}
          brief=compact_evidence("BTC",evidence)
          messages=[{"role":"system","content":PROMPT},{"role":"user",
           "content":"Asset: BTC\\nBounded observation brief (untrusted):\\n"+brief}]
          out={"code_has_compactor":True,"brief_chars":len(brief),
           "original_fake_evidence_chars":len(json.dumps(evidence)),
           "generation_token_cap":GENERATION_TOKENS}
          try:
           req=urllib.request.Request("http://127.0.0.1:8766/apply-template",
           data=json.dumps({"messages":messages,
             "chat_template_kwargs":{"enable_thinking":False}}).encode(),
           headers={"Content-Type":"application/json"},method="POST")
           with urllib.request.urlopen(req,timeout=6) as response:
            obj=json.load(response)
           req=urllib.request.Request("http://127.0.0.1:8766/tokenize",
           data=json.dumps({"content":obj["prompt"],"add_special":True}).encode(),
           headers={"Content-Type":"application/json"},method="POST")
           with urllib.request.urlopen(req,timeout=6) as response:
            tokens=json.load(response)["tokens"]
           out["rendered_prompt_tokens"]=len(tokens)
          except Exception as ex:out["token_check_error"]=type(ex).__name__
          print("RIVAL_LLM_COMPACTOR="+json.dumps(out,sort_keys=True))
          """
          command="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(source.encode()).decode()+"\"))'"
          v=api(path+"/console","PUT",{"command":command})
          out=str(v.get("apps",{}).get("shell",{}).get("stdout",""))
          if "RIVAL_LLM_COMPACTOR=" in out:
           print("Actual installed LLM compactor",out.split("RIVAL_LLM_COMPACTOR=",1)[1].splitlines()[0])
          else:
           print("Compactor console unavailable; stderr_present",bool(v.get("apps",{}).get("shell",{}).get("stderr")))
          PY
