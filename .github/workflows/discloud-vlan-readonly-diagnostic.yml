name: RivaL production LFM3 grounding acceptance
on:
  push:
    branches: ["diagnostics/read-only-discloud-vlan-20261101"]
    paths: [".github/workflows/discloud-vlan-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify authenticated missing-evidence and aligned-past-direction contracts
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error, urllib.parse
          TOKEN=os.getenv("DISCLOUD_TOKEN","")
          MAIN=os.getenv("DISCLOUD_APP_ID","")
          if not TOKEN or not MAIN:raise SystemExit("Existing Discloud credentials missing")
          def console(scenario):
           source="""import json,os,sys,pathlib,time,urllib.request,urllib.error
          from datetime import UTC,datetime,timedelta
          sys.path.insert(0,str(pathlib.Path.cwd()/"src"))
          from parlay_bot.perpetuals.evidence_policy import enforce
          from parlay_bot.perpetuals.local_llm_discovery import discover_private_llm
          scenario=sys.argv[1]
          key=os.getenv("RIVAL_LOCAL_AI_TOKEN","")
          out={"scenario":scenario,"provider":os.getenv("RIVAL_AI_PROVIDER","disabled"),
               "client_policy_present":True,"token_configured":bool(key)}
          peer=discover_private_llm(key) if key else None
          out["authenticated_discovery"]=bool(peer)
          if peer:
           if scenario=="missing":
            evidence={"asset":"BTC","analysis":"synthetic_acceptance_only",
             "sources":[{"venue":"okx","status":"quotes_missing"}]}
           else:
            stamp=(datetime.now(UTC)-timedelta(minutes=2)).isoformat()
            evidence={"asset":"BTC","analysis":"unvalidated_research",
             "synthetic_acceptance_only":True,"horizon_minutes":5,
             "sources":[{"venue":v,"contract":"BTC-USDT-SWAP","quote":"USDT",
               "last_candle_close":stamp,"available_bars":289,
               "windows":{"5m":{"return_pct":n,"sample_bars":1}}}
              for v,n in (("okx",.2),("gate",.3),("bitget",.15))]}
           expected=enforce({"direction":"up","confidence":"high",
                             "thesis":"buy everything","risk":"risk-free"},
                            evidence,asset="BTC")
           out["local_client_expected_direction"]=expected["direction"]
           out["local_client_expected_trend"]=expected["observed_trend"]
           req=urllib.request.Request("http://"+peer+":8765/v1/research",
             data=json.dumps({"asset":"BTC","evidence":evidence}).encode(),
             method="POST",headers={"Authorization":"Bearer "+key,
              "Content-Type":"application/json"})
           started=time.monotonic()
           try:
            with urllib.request.urlopen(req,timeout=55) as response:
             data=json.loads(response.read(16000))
             out.update({"http":response.status,"seconds":round(time.monotonic()-started,2),
              "direction":data.get("direction"),"confidence":data.get("confidence"),
              "observed_trend":data.get("observed_trend"),
              "grounding_status":data.get("grounding_status"),
              "grounded_by":data.get("grounded_by"),
              "model_present":bool(data.get("model")),
              "thesis":data.get("thesis"),"risk":data.get("risk"),
              "informational_only":data.get("informational_only"),
              "uncalibrated":data.get("uncalibrated")})
           except urllib.error.HTTPError as e:
            out["http"]=e.code
           except Exception as e:out["error_class"]=type(e).__name__
          print("RIVAL_GROUNDING_ACCEPTANCE="+json.dumps(out,sort_keys=True))
          """
           command="python -c 'exec(__import__(\"base64\").b64decode(\""+base64.b64encode(source.encode()).decode()+"\"))' "+scenario
           req=urllib.request.Request("https://api.discloud.app/v2/app/"+urllib.parse.quote(MAIN,safe="")+"/console",
           data=json.dumps({"command":command}).encode(),method="PUT",
           headers={"api-token":TOKEN,"Content-Type":"application/json"})
           with urllib.request.urlopen(req,timeout=100) as response:
            result=json.load(response)
           stdout=str(result.get("apps",{}).get("shell",{}).get("stdout",""))
           marker="RIVAL_GROUNDING_ACCEPTANCE="
           if marker not in stdout:
            raise SystemExit("No structured acceptance response from main app")
           return json.loads(stdout.split(marker,1)[1].splitlines()[0])
          for scenario in ("missing","aligned"):
           result=console(scenario)
           print("Production evidence contract",json.dumps(result,sort_keys=True))
           if (result.get("provider")!="local" or not result.get("authenticated_discovery")
               or not result.get("client_policy_present") or result.get("http")!=200
               or not result.get("model_present") or
               result.get("grounded_by")!="deterministic_historical_evidence_policy"
               or result.get("direction")!="uncertain"
               or result.get("confidence")!="low"
               or result.get("local_client_expected_direction")!="uncertain"
               or result.get("observed_trend")!=result.get("local_client_expected_trend")
               or not result.get("thesis") or not result.get("risk")
               or result.get("informational_only") is not True
               or result.get("uncalibrated") is not True):
            raise SystemExit("FAIL: grounded local LFM3 acceptance")
           if scenario=="missing" and result.get("grounding_status")!="insufficient_evidence":
            raise SystemExit("Missing evidence accepted incorrectly")
           if scenario=="aligned" and (result.get("observed_trend")!="up" or
               result.get("grounding_status")!="historical_observations_only"):
            raise SystemExit("Validated historical trend failed")
          print("PASS: live gateway and main-bot grounding agree; no future direction invented")
          PY
