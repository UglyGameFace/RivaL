name: Drive secret fingerprint (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    env:
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - name: Print non-sensitive fingerprints of the Drive OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          fp() {
            local name="$1" value="$2"
            local len=${#value}
            local first3="" last4="" hash=""
            if [ "$len" -gt 0 ]; then
              first3="${value:0:3}"
              last4="${value: -4}"
              hash="$(printf '%s' "$value" | sha256sum | cut -c1-8)"
            fi
            echo "${name}: len=${len} first3=${first3} last4=${last4} sha256_8=${hash}"
          }
          fp "CLIENT_ID" "$RIVAL_DRIVE_OAUTH_CLIENT_ID"
          fp "CLIENT_SECRET" "$RIVAL_DRIVE_OAUTH_CLIENT_SECRET"
          fp "REFRESH_TOKEN" "$RIVAL_DRIVE_OAUTH_REFRESH_TOKEN"
