name: Drive credential configuration (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-presence:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID_PRESENT: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID != '' }}
      CLIENT_SECRET_PRESENT: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET != '' }}
      REFRESH_TOKEN_PRESENT: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN != '' }}
    steps:
      - name: Report credential configuration without credential material
        shell: bash
        run: |
          set -euo pipefail
          printf 'Drive OAuth client ID configured: %s\n' "$CLIENT_ID_PRESENT"
          printf 'Drive OAuth client secret configured: %s\n' "$CLIENT_SECRET_PRESENT"
          printf 'Drive OAuth refresh token configured: %s\n' "$REFRESH_TOKEN_PRESENT"
          if [[ "$CLIENT_ID_PRESENT" != true || "$CLIENT_SECRET_PRESENT" != true || "$REFRESH_TOKEN_PRESENT" != true ]]; then
            echo 'One or more Drive OAuth credentials are not configured.'
            exit 1
          fi
          echo 'All three Drive OAuth credentials are configured; authentication and folder access are NOT verified by this diagnostic.'
