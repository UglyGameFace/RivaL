name: RivaL cumulative warehouse source-month census

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/drive-source-census.yml"
      - "src/parlay_bot/research/drive_source_census.py"
      - "src/parlay_bot/research/source_family_backlog.py"
      - "src/parlay_bot/research/history_priority.py"
      - "tests/test_history_priority.py"
      - "tests/test_source_family_backlog.py"
      - "tests/test_drive_source_census.py"
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * *"

permissions:
  contents: read

concurrency:
  group: rival-cumulative-source-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use existing authenticated Drive client
        run: python -m pip install -e ".[archive]"
      - name: Inspect manifest names across previous independent archive runs
        run: python -m parlay_bot.research.drive_source_census
      - name: Generate all-ten-venue original-family work ledger
        run: python -m parlay_bot.research.source_family_backlog
      - name: Show progress with exact evidence limitations
        if: success()
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open("data/native-reports/drive-source-census.json"))
          rows=["## Warehouse source and asset manifest inventory",
             "Names are NOT byte-SHA readbacks, historical contract listing proof, or model training approval.",
             "| Venue | Asset | Family | Named months | Unlisted months | Name conflicts |",
             "|---|---|---|---:|---:|---:|"]
          for r in d["month_scopes"]:
              conflicts=len(r["conflicting_months"])+len(r["duplicate_name_months"])
              rows.append(f"| {r['venue']} | {r['asset']} | {r['family']} | {r['listed_manifest_months']} | {r['not_listed_months']} | {conflicts} |")
          rows.append(f"\nPartial dYdX/Lighter source page scopes (NOT complete months): {len(d['page_level_sources_not_full_months'])}.")
          rows.append(f"Duplicate manifest names: {d['duplicate_manifest_names']}.")
          backlog=json.load(open("data/native-reports/drive-source-family-backlog.json"))
          rows.extend(["", "### All ten venues, all sixteen family categories",
            "Bitget stays independent: name hints do not prove source history or model readiness.",
            "| Venue | Monthly family hints | Partial pages | Sampled hourly L2 | Lane |",
            "|---|---:|---:|---:|---|"])
          for venue in backlog["venues"]:
              scopes=[x for x in backlog["scopes"] if x["venue"] == venue]
              rows.append(f"| {venue} | "
                          f"{sum(x['monthly_manifest_name_hints'] for x in scopes)} | "
                          f"{sum(x['partial_source_page_scopes'] for x in scopes)} | "
                          f"{sum(x['hourly_original_depth_hints'] for x in scopes)} | "
                          f"{scopes[0]['priority_lane']} |")
          rows.append(
              f"**First priority: {backlog['priority_window']['first_completed_utc_month']} "
              f"through {backlog['priority_window']['last_completed_utc_month']}**, "
              f"24 completed months; November live data is separate."
          )
          rows.append(
              f"{backlog['priority_required_venue_asset_family_month_scopes']} "
              "venue/asset/family/month requirements; "
              f"{backlog['priority_monthly_name_slots_not_byte_verified']} "
              "month names listed, none independently rehashed in this census."
          )
          rows.append(f"{backlog['required_scopes']} original family requirements in artifact; "
                      "actual bytes and contract listings require separate readback.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(rows)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rival-cumulative-warehouse-source-names
          path: |
            data/native-reports/drive-source-census.json
            data/native-reports/drive-source-family-backlog.json
          retention-days: 30
          if-no-files-found: ignore
