name: RivaL Evidence Board source receipt

# This never trains models, trades, deploys, or writes to the source systems.
# Its only mutation is a bounded authenticated summary in the evidence cache.
on:
  # A scoped main-branch push allows the initial signed receipt to run immediately
  # after this collector integration is merged, without waiting for cron.
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-board-receipt.yml"
      - "tools/evidence_board_receipt.py"
      - "tools/evidence_board_github.py"
  # A 10-minute read-only evidence cadence bounds dashboard lag without
  # turning a website refresh into a host console/Drive API request.
  # GitHub scheduled jobs can be delayed or skipped, so UI displays age.
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

concurrency:
  group: rival-evidence-board-source-receipt
  cancel-in-progress: false

jobs:
  publish-verified-read-only-receipt:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate receipt parsing and safety invariants
        run: python -m unittest discover -s tests -p 'test_evidence_board_receipt.py'
      - name: Verify Cloudflare receiver reachability and anonymous-write rejection
        run: python -c "import sys;sys.path.insert(0,'tools');from evidence_board_receipt import receiver_preflight;receiver_preflight()"
      - name: Collect host, database, and private Drive evidence; publish signed summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
          DISCLOUD_LLM_APP_ID: ${{ secrets.DISCLOUD_LLM_APP_ID }}
          RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
          RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
          RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
          RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
        run: python tools/evidence_board_receipt.py
