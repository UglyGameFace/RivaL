name: RivaL Evidence Board source receipt

# This never trains models, trades, deploys, or writes to the source systems.
# Its only mutation is a bounded authenticated summary in the evidence cache.
on:
  # A scoped main-branch push allows the initial signed receipt to run immediately
  # after this collector integration is merged, without waiting for cron.
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-board-receipt.yml"
      - "tools/evidence_board_receipt.py"
      - "tools/evidence_board_github.py"
      - "web/evidence-board/**"
      - "src/**"
      - ".github/workflows/discloud-deploy.yml"
      - ".github/workflows/live-learning-cycle-receipt.yml"
  # The independent hourly Discloud uptime check offers another read when
  # best-effort cron skips. Only the evidence workflow mints a signed OIDC
  # publication; it never reuses upstream artifacts.
  # "RivaL Production Release" was removed 2026-11-17 (Delivery 1): it fires
  # on every completed CI run, so every push storm spawned an evidence run
  # (230 workflow_run runs vs 15 schedule runs in 99h, peaks of 21/hour).
  # The flood masks schedule gaps and re-hits Discloud/Drive/the receiver;
  # redundant triggers now coalesce in the publisher instead.
  workflow_run:
    workflows: ["RivaL independent Discloud uptime"]
    types: [completed]
  # A 10-minute read-only evidence cadence bounds dashboard lag without
  # turning a website refresh into a host console/Drive API request.
  # GitHub scheduled jobs can be delayed or skipped, so UI displays age.
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

# One shared group let the workflow_run flood queue schedule runs behind
# it. Per-event lanes keep the schedule lane independent; a schedule run
# never waits on a push-storm backlog. Publication is idempotent, so a
# queued run being superseded by a newer one loses nothing.
concurrency:
  group: rival-evidence-board-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  publish-verified-read-only-receipt:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate receipt parsing and safety invariants
        run: python -m unittest discover -s tests -p 'test_evidence_board_receipt.py'
      - name: Verify Cloudflare receiver reachability and anonymous-write rejection
        run: python -c "import sys;sys.path.insert(0,'tools');from evidence_board_receipt import receiver_preflight;receiver_preflight()"
      - name: Collect host, database, and private Drive evidence; publish signed summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
          DISCLOUD_LLM_APP_ID: ${{ secrets.DISCLOUD_LLM_APP_ID }}
          RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
          RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
          RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
          RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
        run: |
          code=0
          python tools/evidence_board_receipt.py > evidence-board-publish.log 2>&1 || code=$?
          cat evidence-board-publish.log
          exit $code
      - name: Summarize Intelligence probe in run summary
        if: always()
        run: |
          {
            echo "## Evidence Board receipt"
            echo ""
            if grep -q '"publication": "coalesced"' evidence-board-publish.log 2>/dev/null; then
              echo "- Run coalesced onto a receipt younger than 5 minutes; no new collection ran, so there is no new probe result."
            elif grep -q "^EVIDENCE-BOARD SUMMARY:" evidence-board-publish.log 2>/dev/null; then
              grep "^EVIDENCE-BOARD SUMMARY:" evidence-board-publish.log | sed 's/^/- /'
            else
              echo "- Receipt publication reported no Intelligence probe summary (see the publish step log); treat the probe as not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
