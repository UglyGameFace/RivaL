name: RivaL feature signal experiment

# Offline research only: does RivaL's unused data (basis, funding, taker flow,
# open interest, BTC lead, calendar) predict direction beyond price-only
# inputs? Strict chronological split; nothing is served or traded.
on:
  workflow_dispatch:
    inputs:
      last_month:
        description: "Last complete month to include (YYYY-MM)"
        default: "2026-10"
  push:
    branches: ["research/feature-signal"]
    paths:
      - "tools/feature_signal_experiment.py"
      - ".github/workflows/feature-signal-experiment.yml"

permissions:
  contents: read

concurrency:
  group: rival-feature-signal-experiment
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: binance-cache
          key: binance-original-archive-v1-${{ github.run_id }}
          restore-keys: binance-original-archive-v1-
      - name: Install research packages
        run: python -m pip install "pandas>=2.2" "numpy>=1.26" "lightgbm>=4.5,<5" "httpx>=0.27"
      - name: Run experiment
        run: |
          python tools/feature_signal_experiment.py \
            --cache binance-cache \
            --last-month "${{ inputs.last_month || '2026-10' }}" \
            --out feature-signal-report.json
