name: Gate official bulk archive to verified private Drive

on:
  pull_request:
    paths:
      - ".github/workflows/gate-official-archive-backfill.yml"
      - "src/parlay_bot/research/gate_bulk_archive.py"
      - "src/parlay_bot/research/gate_archive_backfill.py"
      - "src/parlay_bot/archive/drive.py"
      - "tests/test_gate_bulk_archive.py"
      - "tests/test_gate_archive_backfill.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-official-archive-backfill.yml"
      - "src/parlay_bot/research/gate_bulk_archive.py"
      - "src/parlay_bot/research/gate_archive_backfill.py"
  schedule:
    - cron: "27 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: Maximum independently verified Gate archive files per run
        default: "12"
        type: choice
        options: ["4", "8", "12", "16"]

permissions:
  contents: read

concurrency:
  group: rival-gate-public-bulk-archive
  cancel-in-progress: false

jobs:
  gate-contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test source format, source budgets and actual Drive readback wiring
        run: |
          python -m pip install -e ".[dev,archive]"
          ruff check src/parlay_bot/archive/drive.py src/parlay_bot/research/gate_bulk_archive.py src/parlay_bot/research/gate_archive_backfill.py tests/test_gate_bulk_archive.py tests/test_gate_archive_backfill.py
          pytest -q tests/test_gate_bulk_archive.py tests/test_gate_archive_backfill.py

  gate-real-archive-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded public Gate downloader
        run: python -m pip install -e ".[dev]"
      - name: Fetch one real published Gate BTC 5m source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python -m parlay_bot.research.gate_bulk_archive \
            --asset BTC --kind candlesticks_5m \
            --month 2023-04 --out-dir data/gate-smoke
      - name: Preserve independently downloaded public source proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-public-2023-source-smoke
          path: data/gate-smoke/**/*.manifest.json
          if-no-files-found: ignore
          retention-days: 14

  gate-archive-to-drive:
    if: github.event_name != 'pull_request' && vars.RIVAL_GATE_ARCHIVE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MAX_NEW: ${{ inputs.max_new || '12' }}
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original source archive transport and existing Drive client
        run: python -m pip install -e ".[dev,archive]"
      - name: Require complete existing private Drive configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID \
            RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID \
            RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET \
            RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Gate archival private Drive is not configured: $name"
              exit 1
            fi
          done
      - name: Download and verify original Gate futures archives in private Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m parlay_bot.research.gate_archive_backfill \
            --max-new "$MAX_NEW" --max-attempts 20
      - name: Retain real uploaded SHA evidence and unavailable-source ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-private-archive-progress
          path: data/native-reports/gate-bulk-progress.json
          retention-days: 14
          if-no-files-found: ignore
