name: Lighter native historical funding and mark price to Drive

on:
  pull_request:
    paths:
      - ".github/workflows/lighter-original-auxiliary.yml"
      - "src/parlay_bot/research/lighter_auxiliary_archive.py"
      - "tests/test_lighter_auxiliary_archive.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lighter-original-auxiliary.yml"
      - "src/parlay_bot/research/lighter_auxiliary_archive.py"
  schedule:
    - cron: "47 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      month:
        required: true
        type: string
        default: "2025-02"

permissions:
  contents: read

concurrency:
  group: rival-lighter-source-native-auxiliary
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e ".[dev,archive]"
          ruff check src/parlay_bot/research/lighter_auxiliary_archive.py tests/test_lighter_auxiliary_archive.py
          pytest -q tests/test_lighter_auxiliary_archive.py tests/test_lighter_history_recovery.py

  verified-source-acquisition:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,archive]"
      - name: Authenticate configured source warehouse
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - name: Archive genuine source funding and mark prices with SHA readback
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python -m parlay_bot.research.lighter_auxiliary_archive \
              --month auto --assets BTC ETH SOL XRP
          else
            python -m parlay_bot.research.lighter_auxiliary_archive \
              --month "${{ inputs.month || '2025-02' }}" --assets BTC ETH
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighter-funding-mark-source-receipts
          path: data/native-reports/lighter-original-funding-mark.json
          retention-days: 14
          if-no-files-found: ignore
