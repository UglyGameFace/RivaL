name: Lighter native historical funding and mark price to Drive

on:
  pull_request:
    paths:
      - ".github/workflows/lighter-original-auxiliary.yml"
      - "src/parlay_bot/research/lighter_auxiliary_archive.py"
      - "tests/test_lighter_auxiliary_archive.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lighter-original-auxiliary.yml"
      - "src/parlay_bot/research/lighter_auxiliary_archive.py"
  schedule:
    - cron: "47 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      month:
        required: true
        type: string
        default: "2025-02"

permissions:
  contents: read

concurrency:
  group: rival-lighter-source-native-auxiliary
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e ".[dev,archive]"
          ruff check src/parlay_bot/research/lighter_auxiliary_archive.py tests/test_lighter_auxiliary_archive.py
          pytest -q tests/test_lighter_auxiliary_archive.py tests/test_lighter_history_recovery.py
      - name: Probe genuine source window and pagination semantics without downloading archives
        shell: bash
        continue-on-error: true
        run: |
          python - <<'PY'
          import asyncio
          import json
          from collections import Counter
          from datetime import UTC, datetime, timedelta
          import httpx

          from parlay_bot.research.lighter_auxiliary_archive import (
              BASE, active_ids, fetch_source,
          )

          async def run():
              queries = []
              async with httpx.AsyncClient(timeout=30, follow_redirects=False) as client:
                  raw, _ = await fetch_source(client, "orderBooks")
                  ids = active_ids(raw)
                  for asset in ("BTC", "ETH"):
                      market_id = ids.get(asset)
                      if market_id is None:
                          queries.append({"asset": asset, "status": "no_active_market"})
                          continue
                      for day in ("2025-02-07", "2026-09-07", "2026-10-07"):
                          first = datetime.fromisoformat(day).replace(tzinfo=UTC)
                          last = first + timedelta(days=3)
                          for family, endpoint, key, divisor, field in (
                              ("funding", "fundings", "timestamp", 1, "fundings"),
                              ("mark_price", "markPriceCandles", "t", 1000, "c"),
                          ):
                              params = {
                                  "market_id": market_id, "resolution": "1h",
                                  "start_timestamp": int(first.timestamp()),
                                  "end_timestamp": int(last.timestamp()),
                                  "count_back": 750 if family == "funding" else 500,
                              }
                              result = {"asset": asset, "date": day, "family": family}
                              try:
                                  raw, _ = await fetch_source(client, endpoint, params)
                                  payload = json.loads(raw)
                                  rows = payload.get(field, payload.get("candles", []))
                                  if not isinstance(rows, list):
                                      rows = []
                                  stamps = [int(row[key]) // divisor for row in rows
                                            if isinstance(row, dict) and str(row.get(key, "")).isdecimal()]
                                  duplicates = sum(c - 1 for c in Counter(stamps).values() if c > 1)
                                  result.update({
                                      "returned": len(rows), "valid_time_rows": len(stamps),
                                      "within_window": sum(
                                          int(first.timestamp()) <= t < int(last.timestamp())
                                          for t in stamps
                                      ), "duplicated_time_rows": duplicates,
                                      "earliest_utc": datetime.fromtimestamp(
                                          min(stamps), UTC).isoformat() if stamps else None,
                                      "latest_utc": datetime.fromtimestamp(
                                          max(stamps), UTC).isoformat() if stamps else None,
                                      "source_fields": sorted(payload.keys()),
                                  })
                              except (ValueError, RuntimeError, httpx.HTTPError) as exc:
                                  result["error_class"] = type(exc).__name__
                                  result["error_type"] = str(exc)[:100]
                              queries.append(result)
                              await asyncio.sleep(1)
              print(json.dumps({"probe_type": "source_data_shape_only_no_archive",
                                "queries": queries}, sort_keys=True))
          asyncio.run(run())
          PY

  verified-source-acquisition:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,archive]"
      - name: Authenticate configured source warehouse
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - name: Archive genuine source funding and mark prices with SHA readback
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python -m parlay_bot.research.lighter_auxiliary_archive \
              --month auto --assets BTC ETH SOL XRP
          else
            python -m parlay_bot.research.lighter_auxiliary_archive \
              --month "${{ inputs.month || '2025-02' }}" --assets BTC ETH
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighter-funding-mark-source-receipts
          path: data/native-reports/lighter-original-funding-mark.json
          retention-days: 14
          if-no-files-found: ignore
