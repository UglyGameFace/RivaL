name: RivaL LFM3 persisted-research acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/llm-persistence-acceptance.yml"
      - "src/parlay_bot/perpetuals/llm_persistence_acceptance.py"
      - "tools/discloud_llm_persistence.py"
  schedule:
    # Uses GitHub, not a sixth ChatGPT scheduled task. Best-effort timing.
    - cron: "51 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rival-llm-persisted-research-acceptance
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check original acceptance and new main integration proof
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/issues/216" --jq .state)"
          if [[ "$state" == "open" ]]; then
            echo "issue_open=true" >> "$GITHUB_OUTPUT"
          else
            echo "issue_open=false" >> "$GITHUB_OUTPUT"
          fi
          # A source change reaching main requires a NEW host/DB receipt,
          # even when the earlier one-time proof issue was already resolved.
          # Closed issues continue to suppress hourly scheduled probes.
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$state" == "open" ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "Older proof is complete; no hourly Discloud/AI request."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.pending == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.pending == 'true'
        with:
          python-version: "3.11"
      - name: Verify normal research request and exact PostgreSQL receipt
        id: receipt
        if: steps.gate.outputs.pending == 'true'
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: python tools/discloud_llm_persistence.py
      - name: Close only on actual persisted production proof
        if: steps.receipt.outputs.outcome == 'verified' && steps.gate.outputs.issue_open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close 216 --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Verified normal quota-controlled LocalFirstResearch.ask and its exact persisted PostgreSQL perp_ai_research receipt in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No changes to trading, quota rules, LFM3 inference or background AI settings."
