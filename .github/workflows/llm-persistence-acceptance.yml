name: RivaL LFM3 persisted-research acceptance

on:
  # CI tests first, then Discloud deploys its exact passing main SHA.
  # Never probe the host while the new commit is still being built.
  workflow_run:
    workflows: ["RivaL Production Release"]
    types: [completed]
  # Only check after a successfully uploaded release, or on an explicit manual request.
  # The historical proof issues are closed; hourly probes just contend with the local LLM.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: rival-llm-persisted-research-acceptance
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm real deployed main and unresolved acceptance
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.workflow_run.id }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RELEASE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          original_state="$(gh api "repos/$GITHUB_REPOSITORY/issues/216" --jq .state)"
          integration_state="$(gh api "repos/$GITHUB_REPOSITORY/issues/261" --jq .state)"
          if [[ "$original_state" == "open" ]]; then
            echo "issue216_open=true" >> "$GITHUB_OUTPUT"
          else
            echo "issue216_open=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$integration_state" == "open" ]]; then
            echo "issue261_open=true" >> "$GITHUB_OUTPUT"
          else
            echo "issue261_open=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" &&
                "$original_state" != "open" && "$integration_state" != "open" ]]; then
            echo "::notice::Scheduled acceptance already resolved. New releases still require a receipt."
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [[ "$RELEASE_CONCLUSION" != "success" ||
                  "$RELEASE_BRANCH" != "main" ||
                  "$RELEASE_REPO" != "$GITHUB_REPOSITORY" ||
                  "$RELEASE_SHA" != "$main_sha" ]]; then
              echo "::notice::Release did not prove current first-party main."
              echo "pending=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A green release can merely skip deployment. Require the ACTUAL
            # Discloud upload step to have succeeded before spending AI quota.
            deploy_steps="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_ID/jobs" --jq '[.jobs[].steps[]? | select(.name == "Deploy tested RivaL app without replacing its host environment" and .conclusion == "success")] | length')"
            if [[ "$deploy_steps" != "1" ]]; then
              echo "::notice::No successful Discloud upload step for this commit."
              echo "pending=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Inference is local and CPU-bounded, not subject to the retired API quota.
          # Current deployed releases always require a real LFM3 host receipt.
          echo "pending=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.pending == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.pending == 'true'
        with:
          python-version: "3.11"
      - name: Verify real local LFM3 model and exact PostgreSQL receipt
        id: receipt
        if: steps.gate.outputs.pending == 'true'
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: python tools/discloud_llm_persistence.py
      - name: Close original LFM3 issue only on actual stored proof
        if: steps.receipt.outputs.outcome == 'verified' && steps.gate.outputs.issue216_open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close 216 --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Verified genuine local LFM3 persisted PostgreSQL receipt in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
      - name: Close Intelligence integration issue only on actual stored proof
        if: steps.receipt.outputs.outcome == 'verified' && steps.gate.outputs.issue261_open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close 261 --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Verified new math and source-quality evidence in genuine authenticated LFM3 research with a new persisted PostgreSQL row: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No retrospective approval or after-cost advantage implied."
