name: Build directly uploadable RivaL Discloud LLM ZIP

on:
  pull_request:
    paths:
      - "services/rival-llm/**"
      - ".github/workflows/local-llm-discloud-package.yml"
      - "tests/test_private_llm_service.py"
      - "tests/test_llm_voice_moderation.py"
      - "tests/test_private_model_download.py"
      - "tests/test_local_llm_benchmark.py"
      - "tests/test_llm_task_profiles.py"
      - "tests/test_llm_discloud_package.py"
      - "tests/test_private_llm_env.py"
  push:
    branches: [main]
    paths:
      - "services/rival-llm/**"
      - ".github/workflows/local-llm-discloud-package.yml"
      - "tests/test_llm_discloud_package.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rival-llm-discloud-package-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source and deployment contracts
        run: |
          python -m pip install -e ".[dev,archive]"
          ruff check services/rival-llm/ tests/test_local_llm_benchmark.py tests/test_llm_task_profiles.py tests/test_private_llm_service.py tests/test_private_model_download.py tests/test_llm_discloud_package.py tests/test_private_llm_env.py tests/test_llm_voice_moderation.py
          pytest -q tests/test_llm_voice_moderation.py tests/test_private_llm_service.py tests/test_llm_task_profiles.py tests/test_private_model_download.py tests/test_local_llm_benchmark.py tests/test_llm_discloud_package.py
          bash -n services/rival-llm/build.sh
      - name: Build CPU llama.cpp binary in CI only
        shell: bash
        env:
          RIVAL_BUILD_FROM_SOURCE: "1"
        run: |
          set -euo pipefail
          cd services/rival-llm
          bash build.sh
          LD_LIBRARY_PATH="$PWD/runtime/bin" ldd runtime/bin/llama-server | tee "$RUNNER_TEMP/llama-ldd.txt"
          if grep -q "not found" "$RUNNER_TEMP/llama-ldd.txt"; then
            echo "::error::CPU runtime has an unresolved shared library dependency"
            exit 1
          fi
          test ! -e runtime/models
      - name: Stage root files, dereference shared libraries, and validate exact Discloud ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discloud-upload/runtime/bin
          cp services/rival-llm/discloud.config \
             services/rival-llm/main.py \
             services/rival-llm/requirements.txt \
             services/rival-llm/service.py \
             services/rival-llm/voice_moderation.py \
             services/rival-llm/discovery.py \
             services/rival-llm/error_report.py \
             src/parlay_bot/perpetuals/evidence_policy.py \
             services/rival-llm/model_download.py \
             services/rival-llm/benchmark.py \
             services/rival-llm/benchmark_cases.json \
             services/rival-llm/build.sh discloud-upload/
          # GitHub Actions artifacts do not retain executable bits or symlinks.
          # Ship real files at every SONAME alias, never dangling symlinks.
          for file in services/rival-llm/runtime/bin/*; do
            if [ -f "$file" ]; then
              cp -L "$file" "discloud-upload/runtime/bin/$(basename "$file")"
            fi
          done
          python services/rival-llm/validate_package.py discloud-upload
          (cd discloud-upload && zip -q -r ../validated-root-layout.zip .)
          python services/rival-llm/validate_package.py validated-root-layout.zip
          unzip -Z1 validated-root-layout.zip | tee "$RUNNER_TEMP/discloud-manifest.txt"
      - name: Publish ONE ZIP that can be uploaded straight into Discloud
        uses: actions/upload-artifact@v4
        with:
          name: RIVAL-LLM-UPLOAD-THIS-ZIP
          path: discloud-upload/
          include-hidden-files: false
          retention-days: 14

  validate-download:
    runs-on: ubuntu-22.04
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-download the actual GitHub artifact and check root structure
        uses: actions/download-artifact@v4
        with:
          name: RIVAL-LLM-UPLOAD-THIS-ZIP
          path: discloud-download
      - name: Verify extracted artifact can run Discloud build command
        shell: bash
        run: |
          set -euo pipefail
          python services/rival-llm/validate_package.py discloud-download
          cd discloud-download
          bash build.sh
          test -f discloud.config
          test -f main.py
          test -f requirements.txt
          python -m py_compile main.py service.py voice_moderation.py discovery.py error_report.py evidence_policy.py model_download.py
          python -c "import main; assert callable(main.main)"
          test -x runtime/bin/llama-server
          test ! -e rival-llm-discloud.zip

  # Issue #268: prove the shipped supervisor recovers a crashed backend.
  # Real package binary + SHA-verified LFM3 weights, on this isolated runner
  # only; nothing here touches the production Discloud host.
  repair-drill:
    runs-on: ubuntu-22.04
    needs: package
    timeout-minutes: 25
    env:
      RIVAL_LLM_MODEL_DIR: ${{ github.workspace }}/.rival-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the exact package that Discloud receives
        uses: actions/download-artifact@v4
        with:
          name: RIVAL-LLM-UPLOAD-THIS-ZIP
          path: discloud-download
      - name: Restore cached LFM3 weights (SHA re-verified on use)
        uses: actions/cache@v4
        with:
          path: .rival-models
          key: rival-lfm3-gguf-LFM3-1.7B-Q4_K_M-v1
      - name: Kill the llama.cpp backend and require supervised recovery
        shell: bash
        run: |
          set -euo pipefail
          (cd discloud-download && bash build.sh)
          python services/rival-llm/repair_drill.py --app-dir discloud-download \
            | tee "$RUNNER_TEMP/repair-drill.json"
          python - "$RUNNER_TEMP/repair-drill.json" <<'PY'
          import json, sys
          receipt = json.loads(open(sys.argv[1]).read().strip().splitlines()[-1])
          print(f"::notice::LFM3 crash drill passed: recovered in {receipt['recovery_seconds']}s, repair_count={receipt['repair_count']}")
          PY
