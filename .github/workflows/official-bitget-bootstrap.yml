name: Bootstrap official Bitget six-month native models

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "One exact Bitget USDT perpetual instrument"
        required: true
        type: choice
        options: [BTC, ETH, SOL, XRP]
  push:
    branches: [main]
    paths:
      - ".github/workflows/official-bitget-bootstrap.yml"
      - "src/parlay_bot/research/official_bitget.py"
  schedule:
    # Keep six completed native calendar months current. Existing verified
    # partitions are restored and never re-downloaded/re-published.
    - cron: "17 6 2 * *"

permissions:
  contents: read

concurrency:
  group: rival-source-native-research
  cancel-in-progress: false

jobs:
  official-bitget:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native-parity research dependencies
        run: python -m pip install -e ".[dev,ml-research]"
      - name: Recover and verify official historical futures, then train
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID \
            RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID \
            RIVAL_DRIVE_MODELS_FOLDER_ID RIVAL_DRIVE_REPORTS_FOLDER_ID \
            RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET \
            RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required private Drive configuration missing: $name"
              exit 1
            fi
          done
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ASSET="${{ github.event.inputs.asset }}"
          else
            ASSET="BTC"
          fi
          echo "Official Bitget USDT perpetual historical research: $ASSET"
          python -m parlay_bot.research.official_bitget --asset "$ASSET" --months 6
      - name: Summarize independent publication, not model promotion
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          lines = ["### Official source-native public API bootstrap", "",
              "Model imports and live promotion must be assessed separately.",
              "A passing job requires six source-exact complete months restored "
              "from Drive, verified checksums and published research artifacts.",
              "No historical data is counted as live forward predictions."]
          files = sorted(Path("data/bitget-bootstrap/reports").glob("source-*.json"))
          if not files:
              lines.append("No source-native research publication receipt was written.")
          else:
              import json
              for p in files:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  lines.append(f"Venue: `{d.get('venue')}`; status: "
                               f"`{d.get('status')}`; published models: "
                               f"`{d.get('published_models', 0)}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-bitget-research-receipts
          path: data/bitget-bootstrap/reports/source-*.json
          if-no-files-found: ignore
          retention-days: 14
