name: Official Bitget six-month native bootstrap

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "One exact live Bitget USDT perpetual asset"
        type: choice
        options: [BTC, ETH, SOL, XRP]
        default: BTC
        required: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/official-bitget-native-bootstrap.yml"
      - "src/parlay_bot/research/official_bitget_bootstrap.py"
  schedule:
    # One asset daily, conservative public-data budget; resumes verified
    # Drive months without rebuilding already archived native partitions.
    - cron: "13 7 * * *"

permissions:
  contents: read

concurrency:
  group: rival-official-bitget-native-research
  cancel-in-progress: false

jobs:
  public-bitget-months:
    if: vars.RIVAL_NATIVE_PUBLIC_BOOTSTRAP_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing model research and verification dependencies
        run: python -m pip install -e ".[dev,ml-research]"
      - name: Bootstrap one source-native Bitget contract and publish only verified complete months
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID \
            RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID \
            RIVAL_DRIVE_MODELS_FOLDER_ID RIVAL_DRIVE_REPORTS_FOLDER_ID \
            RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET \
            RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Bitget native research cannot verify private archive ($name missing)"
              exit 1
            fi
          done
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ASSET="${{ github.event.inputs.asset }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            ASSET="BTC"
          else
            ASSET="$(python - <<'PY'
          from datetime import UTC, datetime
          print(("BTC", "ETH", "SOL", "XRP")[datetime.now(UTC).date().toordinal() % 4])
          PY
          )"
          fi
          echo "Official Bitget native historical retrieval for $ASSET (research only)"
          python -m parlay_bot.research.official_bitget_bootstrap --asset "$ASSET"
      - name: Preserve source-native evaluation receipts (never raw private provider data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitget-native-bootstrap-evidence
          path: data/native-reports/*.json
          retention-days: 14
          if-no-files-found: ignore
