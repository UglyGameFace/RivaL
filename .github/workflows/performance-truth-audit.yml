name: RivaL performance truth audit

# Read-only: runs an aggregate-count probe on the live host via the Discloud
# console and prints the JSON. No writes, no inference, no secrets echoed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "counts = database counts; render = text of every Research page; logs / intelligence-logs = bot or RivaL-Intelligence console lines"
        type: choice
        options: [counts, render, logs, intelligence-logs]
        default: counts
      since:
        description: "counts mode: only measure issue timing from this ISO time (UTC)"
        default: ""
      pattern:
        description: "logs mode: regex of log lines to print (only matching lines are shown)"
        default: "Bitget|dYdX"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run probe on host
        env:
          MODE: ${{ inputs.mode || 'counts' }}
          PATTERN: ${{ inputs.pattern }}
          SINCE: ${{ inputs.since }}
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
          DISCLOUD_LLM_APP_ID: ${{ secrets.DISCLOUD_LLM_APP_ID }}
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, pathlib
          from urllib import parse, request
          script = ("tools/research_render_probe.py" if os.environ["MODE"] == "render"
                    else "tools/performance_truth_probe.py")
          code = base64.b64encode(gzip.compress(pathlib.Path(script).read_bytes())).decode()
          def run(prefix=""):
              cmd = (prefix + "python -c \"import base64,gzip,sys;sys.path.insert(0,'src');"
                     f"exec(gzip.decompress(base64.b64decode('{code}')))\"")
              req = request.Request(
                  "https://api.discloud.app/v2/app/"
                  + parse.quote(os.environ["DISCLOUD_APP_ID"], safe="") + "/console",
                  data=json.dumps({"command": cmd}).encode(),
                  headers={"api-token": os.environ["DISCLOUD_TOKEN"],
                           "Content-Type": "application/json"}, method="PUT")
              with request.urlopen(req, timeout=500) as response:
                  data = json.load(response)
              return data.get("apps", {}).get("shell", {})
          if os.environ["MODE"] in ("logs", "intelligence-logs"):
              # intelligence-logs reads the separate RivaL-Intelligence app.
              if os.environ["MODE"] == "intelligence-logs":
                  if not os.environ.get("DISCLOUD_LLM_APP_ID"):
                      raise SystemExit("DISCLOUD_LLM_APP_ID secret is not set")
                  os.environ["DISCLOUD_APP_ID"] = os.environ["DISCLOUD_LLM_APP_ID"]
                  os.environ["MODE"] = "logs"
          if os.environ["MODE"] == "logs":
              import re
              req = request.Request(
                  "https://api.discloud.app/v2/app/"
                  + parse.quote(os.environ["DISCLOUD_APP_ID"], safe="") + "/logs",
                  headers={"api-token": os.environ["DISCLOUD_TOKEN"]})
              with request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
              apps = data.get("apps")
              app = apps[0] if isinstance(apps, list) else apps or {}
              text = str((app.get("terminal") or {}).get("big") or "")
              wanted = re.compile(os.environ.get("PATTERN") or "Bitget")
              secret = re.compile(r"(?i)(token|secret|password|key|postgres)")
              lines = [l for l in text.splitlines() if wanted.search(l) and not secret.search(l)]
              print("\n".join(lines[-200:]) or "no matching lines")
              raise SystemExit(0)
          if os.environ["MODE"] == "render":
              merged = {}
              for asset in ("BTC", "ETH", "SOL", "XRP"):
                  shell = run(f"RIVAL_PROBE_ASSETS={asset} ")
                  for line in str(shell.get("stdout", "")).splitlines():
                      if line.startswith("RIVAL_RENDER_PROBE="):
                          merged.update(json.loads(gzip.decompress(
                              base64.b64decode(line.split("=", 1)[1]))))
                          break
                  else:
                      merged[f"error/{asset}"] = str(shell.get("stderr", ""))[-800:]
              pathlib.Path("render.json").write_text(json.dumps(merged, indent=1))
              print(json.dumps(merged, indent=1))
          else:
              since = os.environ.get("SINCE", "").strip()
              if since and not __import__("re").fullmatch(r"[0-9T:+.-]{10,40}", since):
                  raise SystemExit("invalid since")
              shell = run(f"RIVAL_PROBE_SINCE={since} " if since else "")
              for line in str(shell.get("stdout", "")).splitlines():
                  if line.startswith("RIVAL_PERFORMANCE_PROBE="):
                      print(json.dumps(json.loads(line.split("=", 1)[1]), indent=1))
                      break
              else:
                  raise SystemExit("Discloud performance probe returned no verified result; "
                               "stderr tail: " + str(shell.get("stderr", ""))[-800:])
          PY
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('render.json') != ''
        with:
          name: research-render
          path: render.json
