name: RivaL performance truth audit

# Read-only: runs an aggregate-count probe on the live host via the Discloud
# console and prints the JSON. No writes, no inference, no secrets echoed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "counts = database counts; render = text of every Research page; trials = trial table, best per timeframe and Model Lab vs the ledger; logs / intelligence-logs = bot or RivaL-Intelligence console lines"
        type: choice
        options: [counts, render, trials, logs, intelligence-logs]
        default: counts
      since:
        description: "counts mode: only measure issue timing from this ISO time (UTC)"
        default: ""
      pattern:
        description: "logs mode: regex of log lines to print (only matching lines are shown)"
        default: "Bitget|dYdX"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run probe on host
        env:
          MODE: ${{ inputs.mode || 'counts' }}
          PATTERN: ${{ inputs.pattern }}
          SINCE: ${{ inputs.since }}
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
          DISCLOUD_LLM_APP_ID: ${{ secrets.DISCLOUD_LLM_APP_ID }}
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, pathlib
          from urllib import parse, request
          script = {"render": "tools/research_render_probe.py",
                    "trials": "tools/trial_truth_probe.py"}.get(
                        os.environ["MODE"], "tools/performance_truth_probe.py")
          code = base64.b64encode(gzip.compress(pathlib.Path(script).read_bytes())).decode()
          def run(prefix=""):
              cmd = (prefix + "python -c \"import base64,gzip,sys;sys.path.insert(0,'src');"
                     f"exec(gzip.decompress(base64.b64decode('{code}')))\"")
              req = request.Request(
                  "https://api.discloud.app/v2/app/"
                  + parse.quote(os.environ["DISCLOUD_APP_ID"], safe="") + "/console",
                  data=json.dumps({"command": cmd}).encode(),
                  headers={"api-token": os.environ["DISCLOUD_TOKEN"],
                           "Content-Type": "application/json"}, method="PUT")
              with request.urlopen(req, timeout=500) as response:
                  data = json.load(response)
              return data.get("apps", {}).get("shell", {})
          def run_long(prefix, marker, tag):
              """Start the probe in the background on the host and poll its
              output file: one console call is cut at ~100 s by the API
              gateway (HTTP 524), and a full render takes longer."""
              import time
              out = f"/tmp/rival_probe_{tag}_{os.getpid()}.out"
              start = (prefix + "nohup python -c \"import base64,gzip,sys;sys.path.insert(0,'src');"
                       f"exec(gzip.decompress(base64.b64decode('{code}')))\" > {out} 2>&1 &")
              req = request.Request(
                  "https://api.discloud.app/v2/app/"
                  + parse.quote(os.environ["DISCLOUD_APP_ID"], safe="") + "/console",
                  data=json.dumps({"command": start}).encode(),
                  headers={"api-token": os.environ["DISCLOUD_TOKEN"],
                           "Content-Type": "application/json"}, method="PUT")
              with request.urlopen(req, timeout=120) as response:
                  json.load(response)
              for _ in range(60):
                  time.sleep(30)
                  req = request.Request(
                      "https://api.discloud.app/v2/app/"
                      + parse.quote(os.environ["DISCLOUD_APP_ID"], safe="") + "/console",
                      data=json.dumps({"command": f"grep -a '^{marker}' {out} || true"}).encode(),
                      headers={"api-token": os.environ["DISCLOUD_TOKEN"],
                               "Content-Type": "application/json"}, method="PUT")
                  try:
                      with request.urlopen(req, timeout=120) as response:
                          shell = json.load(response).get("apps", {}).get("shell", {})
                  except Exception:  # noqa: BLE001 - a slow poll just retries
                      continue
                  if marker in str(shell.get("stdout", "")):
                      return shell
              return {"stdout": "", "stderr": f"no result after 30 min ({tag})"}
          if os.environ["MODE"] in ("logs", "intelligence-logs"):
              # intelligence-logs reads the separate RivaL-Intelligence app.
              if os.environ["MODE"] == "intelligence-logs":
                  if not os.environ.get("DISCLOUD_LLM_APP_ID"):
                      raise SystemExit("DISCLOUD_LLM_APP_ID secret is not set")
                  os.environ["DISCLOUD_APP_ID"] = os.environ["DISCLOUD_LLM_APP_ID"]
                  os.environ["MODE"] = "logs"
          if os.environ["MODE"] == "logs":
              import re
              req = request.Request(
                  "https://api.discloud.app/v2/app/"
                  + parse.quote(os.environ["DISCLOUD_APP_ID"], safe="") + "/logs",
                  headers={"api-token": os.environ["DISCLOUD_TOKEN"]})
              with request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
              apps = data.get("apps")
              app = apps[0] if isinstance(apps, list) else apps or {}
              text = str((app.get("terminal") or {}).get("big") or "")
              wanted = re.compile(os.environ.get("PATTERN") or "Bitget")
              secret = re.compile(r"(?i)(token|secret|password|key|postgres)")
              lines = [l for l in text.splitlines() if wanted.search(l) and not secret.search(l)]
              print("\n".join(lines[-200:]) or "no matching lines")
              raise SystemExit(0)
          if os.environ["MODE"] == "trials":
              # One coin per console call: each stays well under the API's
              # ~100 s gateway limit.
              merged = {}
              only = os.environ.get("PATTERN") in ("problems", "storage")
              for asset in (("BTC",) if only else ("BTC", "ETH", "SOL", "XRP")):
                  try:
                      shell = run_long(("RIVAL_PROBE_STORAGE=1 "
                                        if os.environ.get("PATTERN") == "storage"
                                        else "RIVAL_PROBE_PROBLEMS_ONLY=1 " if only else "")
                                       + f"RIVAL_PROBE_ASSETS={asset} ",
                                       "RIVAL_TRIAL_PROBE=", f"trials{asset}")
                  except Exception as exc:  # noqa: BLE001
                      merged[f"error/{asset}"] = f"{type(exc).__name__}: {exc}"[:300]
                      continue
                  for line in str(shell.get("stdout", "")).splitlines():
                      if line.startswith("RIVAL_TRIAL_PROBE="):
                          report = json.loads(gzip.decompress(base64.b64decode(
                              line.split("=", 1)[1])))
                          boards = merged.setdefault("boards", {})
                          boards.update(report.pop("boards", {}))
                          merged.update(report)
                          break
                  else:
                      merged[f"error/{asset}"] = str(shell.get("stderr", ""))[-800:]
              pathlib.Path("render.json").write_text(json.dumps(merged, indent=1))
              # Short sections first: the full dump is cut at 60k characters.
              print("TIMINGS " + json.dumps(merged.get("timings"), sort_keys=True))
              print("STORAGE " + json.dumps(merged.get("storage"), sort_keys=True, default=str))
              print("ERRORS " + json.dumps({k: v for k, v in merged.items()
                                            if k.startswith("error")})[:2000])
              print(json.dumps(merged, indent=1)[:60000])
              raise SystemExit(0)
          if os.environ["MODE"] == "render":
              merged = {}
              # The four coins' research pages, then one call for every other
              # page, the model pages and the compare card (BTC).
              for asset in ("BTC", "ETH", "SOL", "XRP", "pages"):
                  prefix = ("RIVAL_PROBE_PAGES=1 RIVAL_PROBE_ASSETS=BTC " if asset == "pages"
                            else f"RIVAL_PROBE_ASSETS={asset} ")
                  try:
                      shell = run_long(prefix, "RIVAL_RENDER_PROBE=", asset)
                  except Exception as exc:  # noqa: BLE001
                      merged[f"error/{asset}"] = f"{type(exc).__name__}: {exc}"[:300]
                      continue
                  for line in str(shell.get("stdout", "")).splitlines():
                      if line.startswith("RIVAL_RENDER_PROBE="):
                          merged.update(json.loads(gzip.decompress(
                              base64.b64decode(line.split("=", 1)[1]))))
                          break
                  else:
                      merged[f"error/{asset}"] = str(shell.get("stderr", ""))[-800:]
              pathlib.Path("render.json").write_text(json.dumps(merged, indent=1))
              print(json.dumps(merged, indent=1))
          else:
              since = os.environ.get("SINCE", "").strip()
              if since and not __import__("re").fullmatch(r"[0-9T:+.-]{10,40}", since):
                  raise SystemExit("invalid since")
              shell = run(f"RIVAL_PROBE_SINCE={since} " if since else "")
              for line in str(shell.get("stdout", "")).splitlines():
                  if line.startswith("RIVAL_PERFORMANCE_PROBE="):
                      print(json.dumps(json.loads(line.split("=", 1)[1]), indent=1))
                      break
              else:
                  raise SystemExit("Discloud performance probe returned no verified result; "
                               "stderr tail: " + str(shell.get("stderr", ""))[-800:])
          PY
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('render.json') != ''
        with:
          name: research-render
          path: render.json
