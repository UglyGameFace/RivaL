name: Phemex original historical 2021 trades research proof

on:
  pull_request:
    paths:
      - ".github/workflows/phemex-2021-trades.yml"
      - "src/parlay_bot/research/phemex_trade_archive.py"
      - "tests/test_phemex_trade_archive.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phemex-2021-trades.yml"
      - "src/parlay_bot/research/phemex_trade_archive.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rival-phemex-old-trades-source
  cancel-in-progress: false

jobs:
  source-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -e ".[dev,archive]"
          ruff check src/parlay_bot/research/phemex_trade_archive.py tests/test_phemex_trade_archive.py
          pytest -q tests/test_phemex_trade_archive.py tests/test_phemex_history_recovery.py

      - name: Read-only source endpoint acceptance (no Drive writes)
        run: |
          python - <<'PY'
          import json
          import httpx
          from parlay_bot.research.phemex_trade_archive import validate
          start = 1609459200000
          url = "https://api.phemex.com/exchange/public/nomics/trades"
          try:
              response = httpx.get(
                  url, params={"market": "BTCUSD", "since": "0-0-0",
                               "start": start, "end": start + 60000},
                  timeout=20, follow_redirects=False,
              )
              data = response.json() if response.status_code == 200 else None
              rows = data.get("data") if isinstance(data, dict) else None
              verdict = {
                  "http_status": response.status_code,
                  "provider_code": data.get("code") if isinstance(data, dict) else None,
                  "trade_rows": len(rows) if isinstance(rows, list) else None,
                  "historical_source_2021_month_verified": False,
              }
              if response.status_code == 200 and isinstance(rows, list):
                  print("source_sample", json.dumps([{
                      "timestamp": x.get("timestamp"), "side": x.get("side"),
                      "fields": sorted(x.keys()),
                  } for x in rows[:2] if isinstance(x, dict)]))
                  proof = validate(
                      response.content, market="BTCUSD",
                      start=start, end=start+60000,
                  )
                  verdict["source_contract"] = proof["market"]
                  verdict["original_trade_rows_validated"] = proof["source_rows"]
              print(json.dumps(verdict))
              if response.status_code != 200 or not isinstance(rows, list):
                  raise SystemExit("Phemex official 2021 trade source could not be verified")
          except (httpx.HTTPError, ValueError, TypeError) as exc:
              raise SystemExit(f"Phemex source verification failed: {type(exc).__name__}: {exc}") from exc
          PY

  original-2021-trades:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,archive]"
      - name: Require known RivaL private Google Drive credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - name: Read 2021 original source trades and independently verify Drive bytes
        run: python -m parlay_bot.research.phemex_trade_archive --day 2021-01-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rival-phemex-2021-original-trades
          path: data/native-reports/phemex-2021-trade-proof.json
          retention-days: 14
          if-no-files-found: ignore
