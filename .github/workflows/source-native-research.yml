name: Source-exact private venue model research

on:
  workflow_dispatch:
    inputs:
      venue:
        description: "Exact source venue to research (not Binance)"
        required: true
        type: choice
        options:
          - hyperliquid
          - dydx
          - bitget
          - gate
          - okx
          - kucoin
          - deribit
          - lighter
          - phemex
      first_month:
        description: "Optional earliest of six completed same-source training months (YYYY-MM)"
        required: false
        type: string
        default: ""
      asset:
        description: "Optional exact Bitget coin; other venues use own available streams"
        required: false
        type: string
        default: ""
jobs:
  offline-venue-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SELECTED_FIRST_MONTH: ${{ inputs.first_month || '' }}
      SELECTED_ASSET: ${{ inputs.asset || '' }}
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
      DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
      DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q -e .
      - name: READ-ONLY list Gate manifest names (TEMP probe, never merge)
        run: |
          python - <<'PY'
          import asyncio
          from collections import Counter
          from parlay_bot.config import Settings
          from parlay_bot.research.publish import _drive
          async def main():
              drive = _drive(Settings())
              await drive._verify_folder_boundary()
              venue = "gate"
              q = (f"'{drive._escape_query(drive.folders.manifests)}' in parents and trashed = false "
                   f"and name contains '{drive._escape_query(venue + '-')}' "
                   "and appProperties has { key='rival_kind' and value='manifest' }")
              found, token = [], None
              for _ in range(20):
                  params = {"q": q, "spaces": "drive", "pageSize": 100,
                            "fields": "nextPageToken,files(name,appProperties)"}
                  if token: params["pageToken"] = token
                  r = await drive._client.get(f"{drive.DRIVE_URL}/files", params=params,
                                              headers=await drive._headers())
                  print("status", r.status_code)
                  data = r.json(); found += data.get("files", [])
                  token = data.get("nextPageToken")
                  if not token: break
              print("total", len(found))
              bad = [f for f in found if not isinstance(f, dict) or not str(f.get("name","")).startswith(venue + "-")]
              print("not starting with gate-:", len(bad))
              for f in bad[:40]:
                  print("BAD", repr(f.get("name") if isinstance(f, dict) else f),
                        (f.get("appProperties") or {}).get("rival_source") if isinstance(f, dict) else "")
              print("prefixes", Counter(str(f.get("name",""))[:12] for f in found).most_common(15))
          asyncio.run(main())
          PY
