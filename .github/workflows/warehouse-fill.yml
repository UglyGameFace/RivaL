name: RivaL warehouse fill and tidy

# Adds official history the models can learn from to the private Drive
# warehouse (Binance order-book depth and open interest, Deribit volatility
# index) and, on request, moves duplicate copies to Drive's trash.
on:
  schedule:
    - cron: "41 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      dedupe:
        description: "Also move duplicate copies to Drive trash (restorable 30 days)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rival-warehouse-fill
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . "pandas>=2.2" "numpy>=1.26" httpx
      - name: Fill
        run: |
          flags="--fill"
          if [[ "${{ inputs.dedupe }}" == "true" ]]; then flags="$flags --dedupe"; fi
          python tools/warehouse_fill.py $flags
