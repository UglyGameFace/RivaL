name: RivaL XMarket native source recovery

# Source collection only: never fit a model, mint a shadow forecast, or
# promote any market call. Advance a bounded native-contract cursor for each
# coin and recheck missing exact source windows in private Drive. Running this
# separately prevents a weekly model training job from being the only chance
# to obtain more source history.
on:
  schedule:
    - cron: "43 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      max_windows:
        description: "New 15-minute source windows per coin (bounded API budget)"
        type: choice
        options: ["24", "48", "96"]
        default: "96"
      evaluate_models:
        description: "Run guarded inner-fold research after original source recovery"
        type: boolean
        default: true
      publish_qualified_offline_candidates:
        description: "Permit only offline-gate-passing models into private Drive"
        type: boolean
        default: false
  push:
    branches: [main]
    # Verify each substantive native-source collector change against original
    # providers immediately after merge, not only at the next six-hour cron.
    # The single concurrency group still serializes credentialed runs.
    paths:
      - ".github/workflows/xmarket-source-recovery.yml"
      - "src/parlay_bot/research/xmarket_history.py"
      # A history promotion timeout previously blocked the ETH source cursor.
      # Re-run bounded original-source recovery after archive transport fixes.
      - "src/parlay_bot/archive/drive.py"
  pull_request:
    paths:
      - ".github/workflows/xmarket-source-recovery.yml"
      - "src/parlay_bot/research/xmarket_history.py"
      - "src/parlay_bot/research/xmarket_training.py"
      - "src/parlay_bot/archive/drive.py"
      - "tests/test_drive_archive.py"
      - "tests/test_drive_history_promotion_reconciliation.py"
      - "tests/test_xmarket_history.py"

permissions:
  contents: read

# Serialize all private Drive cursor writers with the archive trainer.
# PR syntax checks remain isolated so they do not block production jobs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('rival-xmarket-validation-{0}', github.event.pull_request.number) || 'rival-archive-model-training' }}
  cancel-in-progress: false

jobs:
  anchor:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      as_of: ${{ steps.utc.outputs.as_of }}
      trained_through: ${{ steps.utc.outputs.trained_through }}
    steps:
      - name: Freeze UTC source and model clock before collection
        id: utc
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          previous="$(date -u -d yesterday +%Y-%m-%d)"
          echo "as_of=$today" >> "$GITHUB_OUTPUT"
          echo "trained_through=${previous}T23:55:00+00:00" >> "$GITHUB_OUTPUT"
  contract:
    # Source and workflow syntax are tested before main. PRs never get Drive
    # credentials and never perform historical provider downloads.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source-only collector entry point
        run: |
          python -m pip install -e ".[archive]"
          python -m parlay_bot.research.xmarket_history --help
          python tools/xmarket_unattended_lifecycle.py --help

  source:
    needs: anchor
    if: github.event_name != 'pull_request' && needs.anchor.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        asset: [BTC, ETH, SOL, XRP]
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
      WINDOW_BUDGET: ${{ inputs.max_windows || '96' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source collector
        run: python -m pip install -e ".[archive]"
      - name: Verify private Drive and bounded source budget
        shell: bash
        run: |
          set -euo pipefail
          for key in RIVAL_DRIVE_ROOT_FOLDER_ID RIVAL_DRIVE_HISTORY_FOLDER_ID \
                     RIVAL_DRIVE_MANIFESTS_FOLDER_ID RIVAL_DRIVE_STAGING_FOLDER_ID \
                     RIVAL_DRIVE_MODELS_FOLDER_ID RIVAL_DRIVE_REPORTS_FOLDER_ID \
                     RIVAL_DRIVE_OAUTH_CLIENT_ID RIVAL_DRIVE_OAUTH_CLIENT_SECRET \
                     RIVAL_DRIVE_OAUTH_REFRESH_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::XMarket source recovery requires private Drive ${key}"
              exit 1
            fi
          done
          if ! [[ "$WINDOW_BUDGET" =~ ^(24|48|96)$ ]]; then
            echo "::error::Invalid bounded native window budget"
            exit 1
          fi
      - name: Recover actual source windows and publish verified private checkpoints
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          through="${{ needs.anchor.outputs.trained_through }}"
          python -m parlay_bot.research.xmarket_history \
            --asset "$ASSET" --through "$through" \
            --max-windows "$WINDOW_BUDGET" --publish \
            --out "data/native-reports/xmarket-source-${ASSET}.json"
      - name: Summarize verified acquisition progress without uploading private raw rows
        if: always()
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          asset = os.environ["ASSET"]
          path = Path(f"data/native-reports/xmarket-source-{asset}.json")
          if not path.is_file():
              print(f"XMARKET_RECOVERY_SUMMARY={{\"asset\":\"{asset}\",\"status\":\"unavailable\"}}")
              raise SystemExit(0)
          doc = json.loads(path.read_text())
          progress = doc.get("backfill_progress") or {}
          result = {
              "asset": asset,
              "status": "measured_source_progress_not_model_approval",
              "source_points": len(doc.get("samples", [])),
              "cursor_advanced": progress.get("windows_advanced"),
              "pending_by_source": progress.get("pending_by_source"),
              "contract_budget": {
                  key: progress.get(key) for key in (
                      "contract_attempt_limit", "contract_attempts",
                      "overlap_contract_limit", "overlap_contracts_selected",
                      "allocated_new_window_budget", "contract_attempts_by_stage",
                      "paused_sources", "sequential_window_budget",
                      "chronological_window_budgets", "reused_archived_windows",
                      "deferred_verified_comparison_sources",
                  )
              },
              "chronological_recovery": {
                  window: {key: value.get(key) for key in (
                      "previous_cursor", "next_cursor", "floor", "window_budget",
                      "windows_advanced",
                  )}
                  for window, value in progress.get("chronological_recovery", {}).items()
                  if window in ("train", "validation")
              },
              "fidelity": {
                  source: value.get("status")
                  for source, value in doc.get("verification", {}).items()
              },
              "source_comparison": {
                  source: {key: value.get(key) for key in (
                      "blocked_reason", "paired_points", "live_feature_bars",
                      "missing_points", "mismatches", "mismatch_rate", "overlap_coverage",
                  )}
                  for source, value in doc.get("verification", {}).items()
              },
              "error_types": dict(Counter(
                  row.get("failure_code", "unknown")
                  for row in doc.get("errors", [])
              )),
              "model_approved": False,
              "profitability_verified": False,
          }
          print("XMARKET_RECOVERY_SUMMARY=" + json.dumps(result, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## XMarket source-only recovery: " + asset + "\n\n")
              out.write("```json\n" + json.dumps(result, indent=2) + "\n```\n")
              out.write("No source-gap checkpoint proves a fitted or profitable model.\n")
          PY
      - name: Verify recovered chronological admission against private original archives
        # On substantive collector merges, prove the next stage AFTER the
        # new originals/checkpoint publish. Regular six-hour passes keep
        # their existing source-only workload. This reader never fits models.
        if: github.event_name == 'push'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          python -m pip install "pandas>=2.2,<4" "numpy>=1.26,<3"
          python tools/verify_recorded_partial_restore.py \
            --asset "$ASSET" --lookback-days 90 --xmarket-admission \
            --root "data/recorded-private-originals/$ASSET" \
            --out "data/native-reports/recorded-partial-proof-$ASSET.json"
      - name: Upload concise chronological admission verdict only
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: xmarket-chronological-proof-${{ matrix.asset }}-${{ github.run_id }}
          path: data/native-reports/recorded-partial-proof-${{ matrix.asset }}.json
          if-no-files-found: error
          retention-days: 7

  research_after_source:
    # The real source matrix must finish before any sealed model evaluation.
    # Other recovery slots remain source-only. Push runs never publish.
    needs: [anchor, source]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.source.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'schedule' && github.event.schedule == '43 20 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.evaluate_models == true))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        asset: [BTC, ETH, SOL, XRP]
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original-source offline research dependencies
        run: python -m pip install -e ".[ml-research]" "pandas>=2.2" "numpy>=1.26"
      - name: Restore original provider-SHA-verified market manifests
        env:
          ASSET: ${{ matrix.asset }}
          AS_OF: ${{ needs.anchor.outputs.as_of }}
        run: |
          set -euo pipefail
          python tools/restore_archive_months.py --asset "$ASSET" \
            --root data/archive-v1-restore \
            --okx-source-integrity okx-v5-public-history-5m-v1 \
            --as-of "$AS_OF"
      - name: Verify purged inner fold and publish only offline-pass candidates
        env:
          ASSET: ${{ matrix.asset }}
          AS_OF: ${{ needs.anchor.outputs.as_of }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PUBLISH: ${{ inputs.publish_qualified_offline_candidates }}
        run: |
          set -euo pipefail
          arguments=(--asset "$ASSET" --manifests-dir data/archive-v1-restore
            --as-of "$AS_OF" --out "data/native-reports/model-lifecycle-$ASSET.json")
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "43 20 * * *" ]] ||
             [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_PUBLISH" == "true" ]]; then
            arguments+=(--publish-passing)
          fi
          python tools/xmarket_unattended_lifecycle.py "${arguments[@]}"
      - name: Upload only sanitized source and offline gate verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xmarket-native-to-model-${{ matrix.asset }}-${{ github.run_id }}
          path: data/native-reports/model-lifecycle-${{ matrix.asset }}.json
          if-no-files-found: warn
          retention-days: 14
