name: RivaL one-shot verified XMarket train-only research

# One-shot source-authenticated research after the four-asset original-source
# readbacks in run 43975283077. The fixed split dates are pinned to the
# November 16 UTC original-source recovery anchor, NOT selected from model
# scores. No cron, deployment, archive backfill, Drive writes, model imports,
# promotion or sealed validation/test scoring. This merged workflow update
# triggers one bounded read-only four-asset research pass.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xmarket-train-only-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rival-xmarket-train-only-research
  cancel-in-progress: false

jobs:
  train-only:
    # A workflow-file change triggers exactly one authenticated, read-only
    # four-asset pass after a merged main update. No cron, live model import,
    # unbounded history collection or ongoing training schedule.
    # Manual dispatch remains available for a later *new-source* recheck.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        asset: [BTC, ETH, SOL, XRP]
    env:
      RIVAL_DRIVE_ROOT_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_ROOT_FOLDER_ID }}
      RIVAL_DRIVE_HISTORY_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_HISTORY_FOLDER_ID }}
      RIVAL_DRIVE_MANIFESTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MANIFESTS_FOLDER_ID }}
      RIVAL_DRIVE_STAGING_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_STAGING_FOLDER_ID }}
      RIVAL_DRIVE_MODELS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_MODELS_FOLDER_ID }}
      RIVAL_DRIVE_REPORTS_FOLDER_ID: ${{ secrets.RIVAL_DRIVE_REPORTS_FOLDER_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_ID }}
      RIVAL_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.RIVAL_DRIVE_OAUTH_CLIENT_SECRET }}
      RIVAL_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.RIVAL_DRIVE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research tools
        run: python -m pip install -e ".[ml-research]" "pandas>=2.2" "numpy>=1.26"
      - name: Restore already verified original market candles
        run: |
          python tools/restore_archive_months.py --asset ${{ matrix.asset }} \
            --root data/archive-v1-restore \
            --okx-source-integrity okx-v5-public-history-5m-v1
      - name: Research XMarket feature subsets without publishing models
        run: |
          python tools/run_xmarket_train_only_research.py \
            --asset ${{ matrix.asset }} \
            --manifests-dir data/archive-v1-restore \
            --okx-source-integrity okx-v5-public-history-5m-v1 \
            --train-end "2026-09-21T00:00:00+00:00" \
            --test-start "2026-10-19T00:00:00+00:00" \
            --trained-through "2026-11-15T23:55:00+00:00" \
            --out "xmarket-research/${{ matrix.asset }}.json"
      - name: Upload only sanitized research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xmarket-train-only-${{ matrix.asset }}-${{ github.run_id }}
          path: xmarket-research/${{ matrix.asset }}.json
          if-no-files-found: warn
          retention-days: 30
