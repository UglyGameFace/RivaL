name: RivaL Intelligence CI and Discloud release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rival-intelligence-live
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source identity, Python and Discloud credentials
        shell: bash
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_LLM_APP_ID: ${{ secrets.DISCLOUD_LLM_APP_ID }}
        run: |
          set -euo pipefail
          grep -Eq '^[0-9a-f]{40}$' UPSTREAM_COMMIT
          python -m py_compile main.py service.py discovery.py evidence_policy.py model_download.py benchmark.py verify_live.py validate_package.py
          bash -n build.sh
          if [[ -z "$DISCLOUD_TOKEN" || -z "$DISCLOUD_LLM_APP_ID" ]]; then
            echo "::error::Set DISCLOUD_TOKEN and DISCLOUD_LLM_APP_ID for the existing standalone RivaL-Intelligence app; main bot credentials are not used."
            exit 1
          fi
      - name: Reuse previously validated pinned CPU runtime when source is unchanged
        uses: actions/cache@v4
        with:
          path: runtime/bin
          key: rival-intelligence-cpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.sh') }}
      - name: Build pinned CPU runtime on GitHub only
        env:
          RIVAL_BUILD_FROM_SOURCE: "1"
        run: |
          set -euo pipefail
          bash build.sh
          LD_LIBRARY_PATH="$PWD/runtime/bin" ldd runtime/bin/llama-server | tee "$RUNNER_TEMP/llama-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/llama-ldd.txt"; then
            echo "::error::Unresolved CPU runtime shared library"
            exit 1
          fi
      - name: Validate exact deployment and no source, models or credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intelligence-upload/runtime"
          cp discloud.config main.py requirements.txt service.py discovery.py evidence_policy.py model_download.py benchmark.py benchmark_cases.json build.sh UPSTREAM_COMMIT "$RUNNER_TEMP/intelligence-upload/"
          cp -R runtime/bin "$RUNNER_TEMP/intelligence-upload/runtime/bin"
          python validate_package.py "$RUNNER_TEMP/intelligence-upload"
          (cd "$RUNNER_TEMP/intelligence-upload" && zip -q -r "$RUNNER_TEMP/intelligence-validated.zip" .)
          python validate_package.py "$RUNNER_TEMP/intelligence-validated.zip"
      - name: Deploy verified standalone LFM3 to its own Discloud application
        uses: discloud/deploy-action@v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ${{ secrets.DISCLOUD_LLM_APP_ID }}
          glob: |
            discloud.config
            main.py
            requirements.txt
            service.py
            discovery.py
            evidence_policy.py
            model_download.py
            benchmark.py
            benchmark_cases.json
            build.sh
            UPSTREAM_COMMIT
            runtime/bin/**
      - name: Verify live model and exact upstream release on host
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_LLM_APP_ID: ${{ secrets.DISCLOUD_LLM_APP_ID }}
        run: python verify_live.py UPSTREAM_COMMIT
